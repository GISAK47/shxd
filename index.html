<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sát Hạch – Thiết Kế Quy Hoạch Xây Dựng Hạng III</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --surface2:#1c2230;
  --border:#2a3244;
  --gold:#c9a84c;
  --gold-light:#e8c96a;
  --text:#e6eaf0;
  --text-muted:#8b95a7;
  --green:#3fb950;
  --red:#f85149;
  --blue:#58a6ff;
  --radius:10px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Be Vietnam Pro',sans-serif;
  font-size:15px;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,168,76,0.08),transparent),
    radial-gradient(ellipse 60% 40% at 80% 90%,rgba(88,166,255,0.04),transparent);
}

/* ── Header ── */
.header{
  border-bottom:1px solid var(--border);
  padding:16px 24px;
  display:flex;align-items:center;gap:16px;
  background:rgba(22,27,34,0.9);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.header-icon{
  width:40px;height:40px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.header-title{font-family:'Playfair Display',serif;font-size:16px;line-height:1.2;color:var(--text)}
.header-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* ── Timer bar ── */
.timer-bar{
  height:3px;background:var(--border);
  position:fixed;top:0;left:0;right:0;z-index:200;
}
.timer-fill{
  height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));
  transition:width 1s linear, background 1s;
  transform-origin:left;
}
.timer-fill.warning{background:linear-gradient(90deg,#e3a520,#f0c040)}
.timer-fill.danger{background:linear-gradient(90deg,var(--red),#ff7b72)}

/* ── Container ── */
.container{max-width:780px;margin:0 auto;padding:24px 20px 60px}

/* ── Welcome screen ── */
.welcome{
  text-align:center;
  padding:60px 20px 40px;
}
.welcome-badge{
  display:inline-block;
  background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(201,168,76,0.05));
  border:1px solid rgba(201,168,76,0.3);
  border-radius:100px;
  padding:6px 18px;font-size:12px;
  color:var(--gold);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:20px;
}
.welcome h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(24px,5vw,36px);
  line-height:1.2;margin-bottom:8px;
  background:linear-gradient(135deg,var(--text),var(--gold-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.welcome-desc{color:var(--text-muted);font-size:14px;max-width:480px;margin:0 auto 36px}

.info-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:36px;text-align:left;
}
.info-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}
.info-card-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.info-card-value{font-size:20px;font-weight:700;color:var(--gold)}
.info-card-sub{font-size:12px;color:var(--text-muted);margin-top:2px}

.pass-box{
  background:linear-gradient(135deg,rgba(63,185,80,0.08),rgba(63,185,80,0.03));
  border:1px solid rgba(63,185,80,0.2);
  border-radius:var(--radius);
  padding:16px 20px;margin-bottom:28px;
  text-align:left;font-size:13px;
}
.pass-box strong{color:var(--green)}

.btn-start{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#0d1117;font-weight:700;font-size:15px;
  border:none;border-radius:var(--radius);
  padding:14px 48px;cursor:pointer;
  font-family:'Be Vietnam Pro',sans-serif;
  letter-spacing:.3px;
  transition:opacity .2s,transform .15s;
  box-shadow:0 4px 24px rgba(201,168,76,0.3);
}
.btn-start:hover{opacity:.9;transform:translateY(-1px)}
.btn-start:active{transform:translateY(0)}

/* ── Exam header ── */
.exam-topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:10px;
}
.progress-text{font-size:13px;color:var(--text-muted)}
.progress-text span{color:var(--text);font-weight:600}
.timer-display{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:8px 14px;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:1px;
}
.timer-display.warning{border-color:rgba(227,165,32,.4);color:#e3a520}
.timer-display.danger{border-color:rgba(248,81,73,.4);color:var(--red)}
.timer-icon{font-size:14px}

.score-preview{
  display:flex;gap:8px;
}
.score-chip{
  background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;font-size:12px;
}
.score-chip span{font-weight:700;margin-left:4px}
.score-chip.pl span{color:var(--blue)}
.score-chip.cm span{color:var(--gold)}

/* ── Progress bar ── */
.progress-bar-wrap{margin-bottom:24px}
.progress-bar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:2px;transition:width .4s ease}

/* ── Section tag ── */
.section-tag{
  display:inline-block;font-size:11px;letter-spacing:.8px;
  text-transform:uppercase;padding:3px 10px;border-radius:4px;
  margin-bottom:12px;font-weight:600;
}
.section-tag.pl{background:rgba(88,166,255,.12);color:var(--blue);border:1px solid rgba(88,166,255,.2)}
.section-tag.cm{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.2)}

/* ── Question card ── */
.q-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px;
  margin-bottom:16px;
  animation:fadeSlide .3s ease;
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.q-number{font-size:11px;color:var(--text-muted);margin-bottom:10px;font-weight:600;letter-spacing:.5px}
.q-text{font-size:15px;line-height:1.65;color:var(--text);margin-bottom:20px;font-weight:500}

.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;padding:12px 14px;
  cursor:pointer;text-align:left;
  transition:border-color .15s,background .15s;
  color:var(--text);font-size:14px;
  line-height:1.5;font-family:'Be Vietnam Pro',sans-serif;
  width:100%;
}
.opt-btn:hover:not(:disabled){
  border-color:rgba(201,168,76,.5);
  background:rgba(201,168,76,.06);
}
.opt-key{
  width:22px;height:22px;flex-shrink:0;
  background:var(--border);
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  margin-top:1px;
  transition:background .15s,color .15s;
  color:var(--text-muted);
}
.opt-text{flex:1}

/* selected */
.opt-btn.selected{
  border-color:rgba(201,168,76,.6);
  background:rgba(201,168,76,.1);
}
.opt-btn.selected .opt-key{background:var(--gold);color:#0d1117}

/* answered states */
.opt-btn.correct{border-color:rgba(63,185,80,.6);background:rgba(63,185,80,.1)}
.opt-btn.correct .opt-key{background:var(--green);color:#0d1117}
.opt-btn.wrong{border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.07)}
.opt-btn.wrong .opt-key{background:var(--red);color:#fff}
.opt-btn:disabled{cursor:default}
.feedback{font-size:13px;margin-top:14px;padding:10px 14px;border-radius:6px}
.feedback.ok{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.2)}
.feedback.err{background:rgba(248,81,73,.08);color:#ff8a80;border:1px solid rgba(248,81,73,.2)}

/* ── Navigation ── */
.nav-area{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;
}
.btn-nav{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);font-family:'Be Vietnam Pro',sans-serif;
  font-size:13px;font-weight:600;
  border-radius:8px;padding:10px 20px;
  cursor:pointer;transition:border-color .15s,background .15s;
}
.btn-nav:hover{border-color:var(--gold);background:rgba(201,168,76,.05)}
.btn-nav.primary{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#0d1117;border-color:transparent;
  box-shadow:0 2px 12px rgba(201,168,76,.25);
}
.btn-nav.primary:hover{opacity:.9}
.btn-nav:disabled{opacity:.35;cursor:not-allowed}

/* ── Dot navigator ── */
.dot-nav{
  display:flex;flex-wrap:wrap;gap:5px;
  padding:16px 0;justify-content:center;
}
.dot{
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--border);
  font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
  color:var(--text-muted);
}
.dot:hover{border-color:var(--gold);color:var(--gold)}
.dot.current{border-color:var(--gold);background:rgba(201,168,76,.15);color:var(--gold)}
.dot.answered-correct{background:rgba(63,185,80,.15);border-color:rgba(63,185,80,.4);color:var(--green)}
.dot.answered-wrong{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.35);color:var(--red)}
.dot.answered-pl{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.35);color:var(--blue)}

/* ── Result screen ── */
.result{text-align:center;padding:40px 10px}
.result-badge{
  width:100px;height:100px;margin:0 auto 20px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;
  border:3px solid;
}
.result-badge.pass{
  border-color:var(--green);
  background:rgba(63,185,80,.1);
  box-shadow:0 0 40px rgba(63,185,80,.15);
}
.result-badge.fail{
  border-color:var(--red);
  background:rgba(248,81,73,.08);
  box-shadow:0 0 40px rgba(248,81,73,.12);
}
.result h2{
  font-family:'Playfair Display',serif;font-size:28px;margin-bottom:6px;
}
.result h2.pass{color:var(--green)}
.result h2.fail{color:var(--red)}
.result-verdict{font-size:13px;color:var(--text-muted);margin-bottom:30px}

.score-breakdown{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  margin-bottom:24px;
}
.sc-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 12px;
}
.sc-box .sc-val{font-size:28px;font-weight:700;font-family:'Playfair Display',serif}
.sc-box .sc-label{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4}
.sc-box.total .sc-val{color:var(--gold)}
.sc-box.pl .sc-val{color:var(--blue)}
.sc-box.cm .sc-val{color:var(--gold-light)}

.conditions{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:30px;
  text-align:left;
}
.cond-row{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:12px 16px;font-size:13px;
}
.cond-icon{font-size:18px;width:26px;text-align:center}
.cond-text{flex:1}
.cond-result{font-weight:700;font-size:13px}
.cond-result.ok{color:var(--green)}
.cond-result.fail{color:var(--red)}

.btn-retry{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:8px;
  padding:12px 32px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
  margin-right:10px;transition:border-color .15s;
}
.btn-retry:hover{border-color:var(--gold)}
.btn-review{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#0d1117;border:none;
  border-radius:8px;padding:12px 32px;
  font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
  box-shadow:0 2px 12px rgba(201,168,76,.25);
  transition:opacity .15s;
}
.btn-review:hover{opacity:.9}

/* ── Review mode ── */
.review-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:10px;
}
.review-title{font-family:'Playfair Display',serif;font-size:20px}
.review-filter{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-muted);border-radius:6px;
  padding:6px 14px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
  transition:all .15s;
}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08)}

.review-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:20px;margin-bottom:12px;
}
.review-card.correct-border{border-color:rgba(63,185,80,.25)}
.review-card.wrong-border{border-color:rgba(248,81,73,.25)}
.review-q{font-size:14px;line-height:1.6;margin-bottom:14px}
.review-opts{display:flex;flex-direction:column;gap:6px}
.rev-opt{
  display:flex;gap:10px;font-size:13px;padding:8px 12px;
  border-radius:6px;border:1px solid transparent;line-height:1.4;
}
.rev-opt.correct{background:rgba(63,185,80,.08);border-color:rgba(63,185,80,.2);color:var(--green)}
.rev-opt.user-wrong{background:rgba(248,81,73,.07);border-color:rgba(248,81,73,.2);color:#ff8a80}
.rev-opt-key{font-weight:700;width:18px;flex-shrink:0}
.hidden{display:none}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a4458}

@media(max-width:520px){
  .score-breakdown{grid-template-columns:1fr 1fr}
  .sc-box.total{grid-column:span 2}
}
</style>
</head>

<header class="header">
  <div class="header-icon">🏛</div>
  <div>

    <div class="header-sub">Thiết Kế Quy Hoạch Xây Dựng – Hạng III</div>
  </div>
</header>

<div class="container" id="app"></div>

thu, bàn giao đưa công trình vào khai thác sử dụng","c":"Bảo hành, bảo trì công trình xây dựng và hoạt động khác có liên quan đến xây dựng công trình","d":"Các công việc nêu tại điểm a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Dự án đầu tư xây dựng sử dụng vốn ODA thì thực hiện theo quy định nào?","opts":{"a":"Theo quy định của Hiệp định vay vốn mà Việt Nam ký kết với tổ chức cho vay","b":"Theo pháp luật về xây dựng","c":"Theo quy định của Hiệp định vay vốn mà Việt Nam ký kết với tổ chức cho vay, các quy định của pháp luật về xây dựng và pháp luật khác liên quan","d":"Theo quy định của Hiệp định vay vốn mà Việt Nam ký kết với tổ chức cho vay và các quy định của pháp luật về xây dựng"},"ans":"c","section":"phap_luat"},{"q":"Việc áp dụng tiêu chuẩn, quy chuẩn kỹ thuật trong hoạt động đầu tư xây dựng phải tuân thủ theo những nguyên tắc nào?","opts":{"a":"Tuân thủ Quy chuẩn kỹ thuật quốc gia","b":"Tiêu chuẩn được viện dẫn trong quy chuẩn kỹ thuật hoặc văn bản quy phạm pháp luật khác có liên quan","c":"Tiêu chuẩn được áp dụng trong hoạt động đầu tư xây dựng theo nguyên tắc tự nguyện","d":"Tất cả các quy định tại a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Việc giám sát đánh giá đầu tư đối với các dự án đầu tư xây dựng sử dụng vốn đầu tư công, vốn nhà nước ngoài đầu tư công căn cứ vào các quy định nào?","opts":{"a":"Pháp luật về xây dựng","b":"Pháp luật về đầu tư công","c":"Pháp luật về đầu tư công và pháp luật về xây dựng","d":"Pháp luật về đầu tư công, pháp luật về xây dựng và pháp luật khác có liên quan"},"ans":"d","section":"phap_luat"},{"q":"Những chủ thể nào bắt buộc phải mua bảo hiểm công trình trong thời gian thi công xây dựng đối với công trình có ảnh hưởng đến an toàn cộng đồng, môi trường, công trình có yêu cầu kỹ thuật đặc thù, điều kiện thi công xây dựng phức tạp?","opts":{"a":"Chủ đầu tư xây dựng công trình","b":"Nhà thầu thi công xây dựng công trình","c":"Nhà thầu tư vấn thiết kế xây dựng công trình","d":"Cả 3 chủ thể nêu tại a, b và c"},"ans":"a","section":"phap_luat"},{"q":"Nội dung nào sau đây là đúng quy định về trách nhiệm mua bảo hiểm bắt buộc trong hoạt động đầu tư xây dựng?","opts":{"a":"Chủ đầu tư mua bảo hiểm công trình trong thời gian xây dựng đối với công trình có ảnh hưởng đến an toàn cộng đồng, môi trường, công trình có yêu cầu kỹ thuật đặc thù, điều kiện thi công xây dựng phức tạp;","b":"Nhà thầu tư vấn mua bảo hiểm trách nhiệm nghề nghiệp tư vấn đầu tư xây dựng đối với công việc khảo sát xây dựng, thiết kế xây dựng của công trình xây dựng từ cấp II trở lên;","c":"Cả nội dung a và b đều đúng","d":"Các nội dung trên đều sai"},"ans":"c","section":"phap_luat"},{"q":"Dự án đầu tư xây dựng được phân thành loại và nhóm A, B, C đối với các nguồn vốn nào?","opts":{"a":"Nguồn vốn đầu tư công","b":"Nguồn vốn nhà nước ngoài đầu tư công","c":"Nguồn vốn khác không phải nguồn vốn nêu tại điểm a và b","d":"Tất cả các nguồn vốn nêu tại điểm a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Đối với công trình cấp II và cấp III, quy định về thời gian thẩm định thiết kế xây dựng triển khai sau thiết kế cơ sở của cơ quan chuyên môn về xây dựng tính từ ngày nhận đủ hồ sơ hợp lệ như thế nào là đúng?","opts":{"a":"Không quá 40 ngày","b":"Không quá 30 ngày","c":"Không quá 25 ngày","d":"Không quá 20 ngày"},"ans":"b","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, những công tác gì được liệt kê dưới đây thuộc giai đoạn chuẩn bị dự án?","opts":{"a":"Quyết định hoặc chấp thuận chủ trương đầu tư","b":"Lập, thẩm định, phê duyệt Báo cáo nghiên cứu khả thi đầu tư xây dựng","c":"Xin cấp phép xây dựng","d":"Bao gồm công tác a và b"},"ans":"d","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, công tác nào sau đây ở giai đoạn thực hiện dự án?","opts":{"a":"Thanh toán khối lượng xây lắp hoàn thành","b":"Giám sát thi công xây dựng;","c":"Vận hành, chạy thử; nghiệm thu hoàn thành công trình xây dựng","d":"Tất cả các công tác trên"},"ans":"d","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, công trình xây dựng được phân cấp phục vụ quản lý hoạt động đầu tư xây dựng trên cơ sở các căn cứ nào?","opts":{"a":"Quy mô, mức độ quan trọng, thông số kỹ thuật của công trình","b":"Thời hạn sử dụng, vật liệu","c":"Yêu cầu xây dựng công trình","d":"Tất cả các căn cứ trên"},"ans":"a","section":"phap_luat"},{"q":"Việc phân loại công trình xây dựng theo quy định của pháp luật về xây dựng trên cơ sở tiêu chí nào?","opts":{"a":"Theo tính chất kết cấu và công năng sử dụng công trình","b":"Theo kiến trúc công trình","c":"Do người quyết định đầu tư quy định","d":"Do chủ đầu tư quy định"},"ans":"a","section":"phap_luat"},{"q":"Những dự án đầu tư xây dựng nào có thể được phân chia thành các dự án thành phần hoặc phân kỳ đầu tư để quản lý thực hiện như một dự án độc lập?","opts":{"a":"Dự án quan trọng quốc gia, dự án nhóm A","b":"Khi mỗi dự án thành phần có thể vận hành, khai thác độc lập","c":"Dự án nhóm B, C","d":"Cả 3 phương án a, b và c"},"ans":"b","section":"phap_luat"},{"q":"Dự án đầu tư xây dựng phải đáp ứng các yêu cầu nào dưới đây?","opts":{"a":"Phù hợp với quy hoạch và kế hoạch sử dụng đất tại địa phương nơi có dự án đầu tư xây dựng","b":"Có phương án công nghệ và phương án thiết kế xây dựng phù hợp","c":"Bảo đảm chất lượng, an toàn trong xây dựng và bảo vệ môi trường","d":"Cả 3 phương án trên"},"ans":"d","section":"phap_luat"},{"q":"Các dự án đầu tư xây dựng có quy mô nhóm nào yêu cầu phải lập Báo cáo nghiên cứu tiền khả thi để trình cấp có thẩm quyền quyết định hoặc chấp thuận chủ trương đầu tư?","opts":{"a":"Dự án quan trọng quốc gia,","b":"Dự án PPP theo quy định của pháp luật về đầu tư theo phương thức đối tác công tư","c":"Dự án nhóm A sử dụng vốn đầu tư công","d":"Cả 3 phương án trên"},"ans":"d","section":"phap_luat"},{"q":"Trừ trường hợp người quyết định đầu tư có yêu cầu lập Báo cáo nghiên cứu khả thi đầu tư xây dựng, dự án đầu tư xây dựng công trình chỉ cần yêu cầu lập Báo cáo kinh tế - kỹ thuật đầu tư xây dựng gồm trường hợp nào sau đây?","opts":{"a":"Dự án đầu tư xây dựng sử dụng cho mục đích tôn giáo","b":"Dự án đầu tư xây dựng mới, sửa chữa, cải tạo, nâng cấp có tổng mức đầu tư dưới 15 tỷ đồng (không bao gồm tiền sử dụng đất);","c":"Cả trường hợp a và b","d":"Không bao gồm a và b"},"ans":"c","section":"phap_luat"},{"q":"Đối với dự án đầu tư xây dựng sử dụng vốn nhà nước ngoài đầu tư công, cơ quan chuyên môn về xây dựng thẩm định đối với dự án nào sau đây?","opts":{"a":"Dự án từ nhóm B trở lên;","b":"Dự án có công trình ảnh hưởng lớn đến an toàn, lợi ích cộng đồng thuộc chuyên ngành quản lý;","c":"Đáp án a và b đúng","d":"Các dự án trên địa bàn phụ trách"},"ans":"c","section":"phap_luat"},{"q":"Đối với dự án đầu tư xây dựng sử dụng vốn đầu tư công, cơ quan chuyên môn về xây dựng thuộc Bộ quản lý công trình xây dựng chuyên ngành thẩm định đối với dự án nào sau đây?","opts":{"a":"Dự án nhóm A; dự án nhóm B do người đứng đầu cơ quan trung ương quyết định đầu tư hoặc phân cấp, ủy quyền quyết định đầu tư;","b":"Dự án được đầu tư xây dựng trên địa bàn hành chính từ 02 tỉnh trở lên;","c":"Dự án do Thủ tướng Chính phủ giao;","d":"Bao gồm tất cả các dự án trên."},"ans":"d","section":"phap_luat"},{"q":"Đối với dự án quan trọng quốc gia có công nghệ hạn chế chuyển giao sử dụng vốn đầu tư công thì cơ quan nào sau đây thẩm định thiết kế công nghệ?","opts":{"a":"Sở Xây dựng","b":"Cơ quan chuyên môn trực thuộc người quyết định đầu tư","c":"Chủ đầu tư xây dựng","d":"Hội đồng thẩm định nhà nước"},"ans":"d","section":"phap_luat"},{"q":"Đối với các dự án đầu tư xây dựng điều chỉnh, cơ quan chuyên môn về xây dựng thẩm định Báo cáo nghiên cứu khả thi điều chỉnh trong trường hợp nào sau đây?","opts":{"a":"Khi điều chỉnh dự án có thay đổi về mục tiêu, quy mô sử dụng đất, quy mô đầu tư xây dựng;","b":"Khi điều chỉnh làm tăng tổng mức đầu tư dự án đối với dự án sử dụng vốn đầu tư công, dự án sử dụng vốn nhà nước ngoài đầu tư công;","c":"Cả trường hợp a và b","d":"Không bao gồm các trường hợp ở trên"},"ans":"c","section":"phap_luat"},{"q":"Đối với nguồn vốn khác thì cơ quan chuyên môn về xây dựng thuộc các Bộ quản lý công trình xây dựng chuyên ngành thẩm định những dự án nào?","opts":{"a":"Dự án đầu tư xây dựng có công trình cấp đặc biệt, cấp I và cấp II, dự án được đầu tư xây dựng trên địa bàn hành chính của 02 tỉnh trở lên","b":"Dự án do Quốc hội, Thủ tướng Chính phủ chấp thuận chủ trương đầu tư; dự án nhóm A; dự án đầu tư xây dựng có công trình cấp đặc biệt, cấp I; dự án được đầu tư xây dựng trên địa bàn hành chính của 02 tỉnh trở lên","c":"Dự án đầu tư xây dựng có công trình từ cấp III trở lên và dự án được đầu tư xây dựng trên địa bàn hành chính của 02 tỉnh trở lên","d":"Chỉ dự án nhóm A"},"ans":"b","section":"phap_luat"},{"q":"Cơ quan chuyên môn về xây dựng thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng đối với các dự án nào sau đây?","opts":{"a":"Dự án sử dụng vốn đầu tư công; Dự án đầu tư xây dựng có quy mô từ nhóm B trở lên hoặc có công trình ảnh hưởng lớn đến an toàn, lợi ích cộng đồng sử dụng vốn nhà nước ngoài đầu tư công;","b":"Dự án PPP; Dự án đầu tư xây dựng có quy mô lớn hoặc có công trình ảnh hưởng lớn đến an toàn, lợi ích cộng đồng sử dụng vốn khác.","c":"Cả a và b","d":"Không bao gồm a và b"},"ans":"c","section":"phap_luat"},{"q":"Đối với dự án sử dụng vốn đầu tư công, dự án sử dụng vốn nhà nước ngoài đầu tư công chỉ cần lập Báo cáo kinh tế - kỹ thuật, người quyết định đầu tư thẩm định những nội dung nào sau đây?","opts":{"a":"Sự phù hợp về quy hoạch, mục tiêu, quy mô đầu tư và các yêu cầu khác được xác định trong quyết định hoặc chấp thuận chủ trương đầu tư xây dựng;","b":"Sự đáp ứng yêu cầu của thiết kế bản vẽ thi công về bảo đảm an toàn công trình và biện pháp bảo đảm an toàn công trình lân cận;","c":"Việc lập tổng mức đầu tư xây dựng, xác định giá trị tổng mức đầu tư xây dựng;","d":"Tất cả các nội dung ở trên"},"ans":"d","section":"phap_luat"},{"q":"Hợp đồng trong hoạt động xây dựng theo hình thức giá có những loại nào?","opts":{"a":"Hình thức trọn gói, hình thức theo thời gian","b":"Hình thức điều chỉnh giá, hình thức theo đơn giá cố định","c":"Bao gồm các hình thức nêu tại a và b","d":"Không có hình thức nào nêu tại a và b"},"ans":"c","section":"phap_luat"},{"q":"Chức năng, nhiệm vụ của Ban QLDA chuyên ngành, ban QLDA khu vực do ai quy định?","opts":{"a":"Người có thẩm quyền quyết định đầu tư","b":"Người quyết định thành lập Ban QLDA chuyên ngành, ban QLDA khu vực","c":"Cơ quan chuyên môn về xây dựng","d":"Chủ đầu tư"},"ans":"b","section":"phap_luat"},{"q":"Đối với các dự án đầu tư xây dựng điều chỉnh, cơ quan chuyên môn về xây dựng thẩm định Báo cáo nghiên cứu khả thi điều chỉnh trong trường hợp nào sau đây?","opts":{"a":"Khi điều chỉnh dự án có thay đổi về mục tiêu, quy mô sử dụng đất, quy mô đầu tư xây dựng;","b":"Khi có thay đổi về chỉ tiêu quy hoạch, kiến trúc của dự án tại quy hoạch chi tiết xây dựng, quy hoạch có tính chất kỹ thuật chuyên ngành khác hoặc quyết định/chấp thuận chủ trương đầu tư được phê duyệt;","c":"Khi điều chỉnh làm tăng tổng mức đầu tư dự án đối với dự án sử dụng vốn đầu tư công, dự án sử dụng vốn nhà nước ngoài đầu tư công;","d":"Tất cả các nội dung trên"},"ans":"d","section":"phap_luat"},{"q":"Chủ thể nào phải chịu trách nhiệm chính về an toàn lao động trên công trường?","opts":{"a":"Chủ đầu tư","b":"Nhà thầu thi công xây dựng công trình","c":"Nhà thầu tư vấn giám sát thi công xây dựng công trình","d":"Cả a, b và c"},"ans":"b","section":"phap_luat"},{"q":"Các dự án đầu tư xây dựng thuộc Tập đoàn kinh tế, Tổng công ty nhà nước phải tuân thủ theo các quy định nào?","opts":{"a":"Điều lệ, quy chế hoạt động của Tập đoàn, Tổng công ty","b":"Theo quy định pháp luật về xây dựng, pháp luật về đấu thầu và pháp luật khác liên quan","c":"Bao gồm a và b","d":"Chỉ tuân thủ quy định của pháp luật về xây dựng"},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, đối với nguồn vốn khác, chủ đầu tư có thể áp dụng hình thức quản lý dự án nào sau đây?","opts":{"a":"Chủ đầu tư sử dụng tư cách pháp nhân của mình và bộ máy chuyên môn trực thuộc có đủ điều kiện, năng lực","b":"Chủ đầu tư được thuê tổ chức, cá nhân có đủ điều kiện năng lực","c":"Đáp án a và b là đúng","d":"Đáp án a và b là sai"},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, đối với các gói thầu sử dụng vốn nhà nước ngoài đầu tư công thì hợp đồng xây dựng được ký kết vào thời điểm nào?","opts":{"a":"Sau khi hoàn thành việc lựa chọn nhà thầu","b":"Sau khi hoàn thành việc lựa chọn nhà thầu và kết thúc đàm phán hợp đồng","c":"Trước khi khởi công xây dựng công trình","d":"Cả 3 phương án a, b và c"},"ans":"b","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, đối với các gói thầu sử dụng vốn đầu tư công thì hợp đồng xây dựng được ký kết giữa bên giao thầu và bên nhận thầu bằng hình thức nào?","opts":{"a":"Bằng văn bản thỏa thuận giữa bên giao thầu và bên nhận thầu để thực hiện một phần công việc trong hoạt động đầu tư xây dựng.","b":"Bằng văn bản thỏa thuận giữa bên giao thầu và bên nhận thầu để thực hiện toàn bộ công việc trong hoạt động đầu tư xây dựng.","c":"Phương án a hoặc b","d":"Cả 2 phương án a và b"},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, đối với các gói thầu sử dụng vốn đầu tư công, trường hợp bên nhận thầu là liên danh các nhà thầu thì khi ký kết hợp đồng xây dựng với bên giao thầu những nhà thầu nào trong liên danh phải cử đại diện hợp pháp của mình để ký hợp đồng?","opts":{"a":"Nhà thầu được liên danh các nhà thầu cử làm đại diện cho liên danh","b":"Tất cả các nhà thầu tham gia trong liên danh","c":"Phương án a hoặc b","d":"Bất kể nhà thầu nào trong liên danh theo yêu cầu của bên giao thầu"},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, đối với các gói thầu sử dụng vốn đầu tư công thì hiệu lực của hợp đồng xây dựng được tính từ thời điểm nào?","opts":{"a":"Từ ngày ký kết hợp đồng","b":"Từ ngày bên giao thầu nhận được bảo đảm thực hiện hợp đồng của bên nhận thầu","c":"Từ ngày do bên giao thầu và bên nhận thầu thỏa thuận trong hợp đồng.","d":"Bao gồm cả a, b và c"},"ans":"c","section":"phap_luat"},{"q":"Đối với các gói thầu sử dụng vốn đầu tư công, việc điều chỉnh đơn giá thực hiện hợp đồng chỉ được áp dụng đối với loại hợp đồng nào?","opts":{"a":"Hợp đồng theo đơn giá cố định; hợp đồng theo thời gian","b":"Hợp đồng theo đơn giá điều chỉnh, hợp đồng theo thời gian","c":"Cả a và b","d":"a hoặc b"},"ans":"b","section":"phap_luat"},{"q":"Trước khi ký kết hợp đồng EPC các bên phải thỏa thuận cụ thể những nội dung chủ yếu nào sau đây?","opts":{"a":"Phạm vi công việc dự kiến thực hiện theo hợp đồng EPC; Vị trí xây dựng, hướng tuyến công trình, loại, cấp công trình; quy mô, công suất và phương án sản phẩm được lựa chọn, năng lực khai thác sử dụng;","b":"Các thông tin về các tài liệu, số liệu về điều kiện tự nhiên, địa chất công trình, địa chất thủy văn, thủy văn của khu vực nơi xây dựng công trình; Các yêu cầu về thiết kế xây dựng và một số thông số thiết kế ban đầu;","c":"Bao gồm cả nội dung a và b","d":"Không bao gồm nội dung a và b"},"ans":"c","section":"phap_luat"},{"q":"Đối với các gói thầu thi công xây dựng sử dụng vốn đầu tư công, tiến độ thực hiện hợp đồng được điều chỉnh trong các trường hợp nào?","opts":{"a":"Trong quá trình thực hiện hợp đồng xảy ra các trường hợp bất khả kháng","b":"Do bên giao thầu thay đổi thiết kế hoặc bàn giao mặt bằng không đúng với thỏa thuận trong hợp đồng","c":"Đáp án a và b đúng","d":"Các trường hợp trên đều không đúng"},"ans":"c","section":"phap_luat"},{"q":"Hợp đồng EPC là loại hợp đồng thực hiện những công việc gì?","opts":{"a":"Thiết kế và thi công xây dựng","b":"Thiết kế và cung cấp vật tư, thiết bị","c":"Thiết kế - mua sắm vật tư, thiết bị - thi công xây dựng công trình","d":"Lập dự án, thiết kế, cung cấp vật tư, thiết bị và thi công xây dựng"},"ans":"c","section":"phap_luat"},{"q":"Đối với hợp đồng EPC ngoài tiến độ thi công cho từng giai đoạn của tổng thầu, nhà :"phap_luat"},{"q":"Trường hợp thuê tư vấn quản lý dự án thì nhiệm vụ, quyền hạn của tư vấn QLDA do ai quyết định?","opts":{"a":"Do chủ đầu tư thông qua hợp đồng","b":"Do pháp luật quy định","c":"Do người quyết định đầu tư","d":"Cấp trên của tổ chức tư vấn quản lý dự án"},"ans":"a","section":"phap_luat"},{"q":"Theo quy định của pháp luật xây dựng hiện hành, hợp đồng xây dựng không có hình thức nào dưới đây?","opts":{"a":"Hợp đồng trọn gói","b":"Hợp đồng theo tỷ lệ %","c":"Hợp đồng theo đơn giá điều chỉnh","d":"Hợp đồng theo đơn giá cố định"},"ans":"b","section":"phap_luat"},{"q":"Trong quá trình thực hiện hợp đồng, bên nhận thầu có được thay đổi người đại diện quản lý thực hiện hợp đồng không?","opts":{"a":"Có","b":"Không","c":"Có nhưng phải được sự chấp thuận của bên giao thầu","d":"Cả a, b và c đều không đúng"},"ans":"c","section":"phap_luat"},{"q":"Nguyên tắc và trình tự giải quyết tranh chấp hợp đồng xây dựng được quy định như thế nào sau đây?","opts":{"a":"Tôn trọng các thỏa thuận hợp đồng và các cam kết trong quá trình thực hiện hợp đồng, bảo đảm bình đẳng và hợp tác;","b":"Các bên hợp đồng có trách nhiệm tự thương lượng giải quyết tranh chấp. Trường hợp các bên hợp đồng không tự thương lượng được thì tranh chấp được giải quyết thông qua hòa giải, trọng tài thương mại hoặc tòa án theo quy định của pháp luật.","c":"Đáp ứng cả a và b","d":"Không cần đáp ứng những yêu cầu trên"},"ans":"c","section":"phap_luat"},{"q":"Những cá nhân nào dưới đây không bắt buộc phải có chứng chỉ hành nghề hoạt động xây dựng?","opts":{"a":"Chủ nhiệm thiết kế xây dựng công trình","b":"Chủ trì thiết kế bộ môn trong công trình xây dựng","c":"Cá nhân giám sát thi công của nhà thầu thi công xây dựng","d":"Cán bộ tư vấn giám sát thi công xây dựng"},"ans":"c","section":"phap_luat"},{"q":"Chủ nhiệm thiết kế xây dựng hạng I phải đáp ứng các điều kiện gì?","opts":{"a":"Có trình độ đại học thuộc chuyên ngành phù hợp","b":"Có thời gian làm công tác thiết kế xây dựng tối thiểu 7 năm","c":"Đã làm chủ nhiệm thiết kế phần việc thuộc lĩnh vực phù hợp ít nhất 01 công trình từ cấp I trở lên hoặc 02 công trình từ cấp II trở lên","d":"Cả a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Chủ thể nào sau đây có trách nhiệm lập bản vẽ hoàn công công trình?","opts":{"a":"Chủ đầu tư","b":"Nhà thầu thiết kế xây dựng","c":"Nhà thầu thi công xây dựng","d":"Nhà thầu tư vấn giám sát thi công xây dựng"},"ans":"c","section":"phap_luat"},{"q":"Chủ thể nào có trách nhiệm lập tiến độ chi tiết thi công xây dựng công trình?","opts":{"a":"Chủ đầu tư","b":"Nhà thầu thiết kế xây dựng công trình","c":"Nhà thầu thi công xây dựng công trình","d":"Nhà thầu tư vấn giám sát thi công xây dựng"},"ans":"c","section":"phap_luat"},{"q":"Đối với công trình xây dựng sử dụng vốn đầu tư công, công trình xây dựng sử dụng vốn nhà nước ngoài đầu tư công, chủ đầu tư thẩm định thiết kế xây dựng triển khai sau thiết kế cơ sở đối với các nội dung nào sau đây?","opts":{"a":"Sự đáp ứng yêu cầu của thiết kế xây dựng với nhiệm vụ thiết kế, quy định tại hợp đồng thiết kế và quy định của pháp luật có liên quan;","b":"Sự phù hợp của thiết kế xây dựng với yêu cầu về dây chuyền và thiết bị công nghệ (nếu có);","c":"Việc lập dự toán xây dựng công trình; sự phù hợp của giá trị dự toán xây dựng công trình với giá trị tổng mức đầu tư xây dựng; xác định giá trị dự toán xây dựng công trình.","d":"Bao gồm tất cả các nội dung ở trên"},"ans":"d","section":"phap_luat"},{"q":"Số bước thiết kế xây dựng do ai quyết định?","opts":{"a":"Người quyết định đầu tư khi phê duyệt dự án","b":"Chủ đầu tư khi triển khai thực hiện dự án","c":"Tổ chức tư vấn khi lập dự án đầu tư xây dựng","d":"Cả 3 phương án trên đều sai"},"ans":"a","section":"phap_luat"},{"q":"Chủ thể nào có trách nhiệm thực hiện bảo hành công trình xây dựng?","opts":{"a":"Chủ đầu tư xây dựng công trình","b":"Nhà thầu thi công xây dựng công trình","c":"Nhà thầu thiết kế xây dựng công trình","d":"Cả 3 phương án trên đầu đúng"},"ans":"b","section":"phap_luat"},{"q":"Việc điều chỉnh dự án sử dụng vốn khác phải đảm bảo yêu cầu nào sau đây?","opts":{"a":"Các yêu cầu về quy hoạch","b":"Các yêu cầu về an toàn, bảo vệ môi trường","c":"Các yêu cầu về phòng, chống cháy, nổ, quốc phòng, an ninh","d":"Cả 3 phương án a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Dự án đầu tư xây dựng sử dụng vốn đầu tư công được xem xét điều chỉnh trong những trường hợp nào?","opts":{"a":"Do ảnh hưởng của thiên tai, sự cố môi trường, địch họa, hỏa hoạn và các yếu tố bất khả kháng khác","b":"Xuất hiện yếu tố mang lại hiệu quả cao hơn cho dự án khi đã được chủ đầu tư chứng minh về hiệu quả tài chính, kinh tế - xã hội do việc điều chỉnh dự án mang lại","c":"Khi quy hoạch xây dựng thay đổi có ảnh hưởng trực tiếp tới dự án","d":"Cả a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Theo quy định của pháp luật về môi trường, những loại dự án nào phải lập báo cáo đánh giá tác động môi trường?","opts":{"a":"Dự án quan trọng quốc gia","b":"Dự án đầu tư xây dựng đô thị mới, khu dân cư tập trung","c":"Dự án khai thác, sử dụng nước dưới đất và tài nguyên thiên nhiên có quy mô lớn","d":"Cả a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Trường hợp công việc được xác định rõ về số lượng, khối lượng, thời gian thực hiện ngắn thì áp dụng hình thức hợp đồng nào là hợp lý nhất?","opts":{"a":"Hợp đồng trọn gói","b":"Hợp đồng theo đơn giá","c":"Hợp đồng theo thời gian","d":"Hợp đồng theo đơn giá cố định"},"ans":"a","section":"phap_luat"},{"q":"Trường hợp công việc chưa đủ điều kiện để xác định chính xác về số lượng hoặc khối lượng thì nên áp dụng hình thức hợp đồng nào là thích hợp nhất?","opts":{"a":"Hợp đồng trọn gói","b":"Hợp đồng theo đơn giá cố định","c":"Hợp đồng theo thời gian","d":"Hợp đồng theo tỷ lệ phần trăm"},"ans":"b","section":"phap_luat"},{"q":"Bên giao thầu có quyền chấm dứt hợp đồng trong các trường hợp nào sau đây?","opts":{"a":"Bên nhận thầu bị phá sản hoặc Bên nhận thầu không thực hiện công việc theo hợp đồng 45 ngày liên tục mà không có lý do","b":"Bên nhận thầu chuyển nhượng lợi ích của hợp đồng xây dựng cho bên khác mà không có nêu trong hợp đồng đã ký kết","c":"Bao gồm các đáp án a và b","d":"Việc chấm dứt hợp đồng là do bên giao thầu quyết định"},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật về xây dựng, bản vẽ thiết kế xây dựng trong hồ sơ đề nghị cấp giấy phép xây dựng là bản vẽ của bước thiết kế nào?","opts":{"a":"Thiết kế cơ sở","b":"Thiết kế kỹ thuật hoặc thiết kế bản vẽ thi công đã được thẩm định, phê duyệt theo quy định","c":"Thiết kế bản vẽ thi công đã được thẩm định, phê duyệt","d":"Một trong phương án a, b hoặc c"},"ans":"b","section":"phap_luat"},{"q":"Khi khởi công xây dựng công trình yêu cầu phải có các điều kiện nào dưới đây?","opts":{"a":"Có mặt bằng xây dựng để bàn giao toàn bộ hoặc từng phần theo tiến độ xây dựng","b":"Có thiết kế bản vẽ thi công của hạng mục công trình, công trình khởi công đã được phê duyệt","c":"Đáp ứng cả điều kiện nêu tại a và b","d":"Chỉ cần đáp ứng điều kiện a hoặc b"},"ans":"c","section":"phap_luat"},{"q":"Ai có thẩm quyền phê duyệt điều chỉnh dự án đầu tư xây dựng?","opts":{"a":"Người quyết định đầu tư","b":"Chủ đầu tư","c":"Ban quản lý dự án","d":"Cơ quan quản lý nhà nước có thẩm quyền"},"ans":"a","section":"phap_luat"},{"q":"Cơ quan chuyên môn về xây dựng là cơ quan nào?","opts":{"a":"Cơ quan chuyên môn thuộc Bộ Xây dựng","b":"Cơ quan chuyên môn thuộc Bộ Giao thông vận tải, Bộ Công thương, Bộ Nông nghiệp và phát triển nông thôn","c":"Các Sở Xây dựng, Sở Giao thông vận tải, Sở Công thương, Sở Nông nghiệp và phát triển nông thôn","d":"Bao gồm cả a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Theo quy định của Luật Xây dựng, công tác thẩm định là việc kiểm tra, đánh giá của ai?","opts":{"a":"Người quyết định đầu tư, chủ đầu tư, cơ quan chuyên môn về xây dựng","b":"Cơ quan chuyên môn của người quyết định đầu tư","c":"Người quyết định đầu tư, chủ đầu tư","d":"Tổ chức tư vấn có đủ điều kiện năng lực hoạt động xây dựng"},"ans":"a","section":"phap_luat"},{"q":"Đối với dự án sử dụng vốn đầu tư công, người quyết định đầu tư có thể giao đơn vị nào sau đây làm chủ đầu tư?","opts":{"a":"Ban quản lý dự án đầu tư xây dựng chuyên ngành, Ban quản lý dự án đầu tư xây dựng khu vực;","b":"Cơ quan, tổ chức có kinh nghiệm, năng lực quản lý;","c":"Đáp án a và b đúng","d":"Đơn vị được giao khai thác vận hành công trình"},"ans":"c","section":"phap_luat"},{"q":"Việc điều chỉnh dự án đầu tư xây dựng sử dụng vốn đầu tư công đã được phê duyệt do ai quyết định?","opts":{"a":"Người quyết định đầu tư","b":"Chủ đầu tư","c":"Cơ quan chuyên môn về xây dựng","d":"Bao gồm cả a, b và c"},"ans":"a","section":"phap_luat"},{"q":"Ban quản lý dự án đầu tư xây dựng một dự án là tổ chức như thế nào sau đây?","opts":{"a":"Là tổ chức trực thuộc chủ đầu tư","b":"Được sử dụng con dấu riêng, được mở tài khoản tại kho bạc nhà nước hoặc ngân hàng thương mại","c":"Chịu trách nhiệm trước pháp luật và chủ đầu tư về hoạt động quản lý dự án của mình.","d":"Bao gồm tất cả những nội dung trên"},"ans":"d","section":"phap_luat"},{"q":"Trong quá trình lập dự án đầu tư xây dựng, tổ chức tư vấn lập dự án có các nghĩa vụ gì?","opts":{"a":"Thực hiện theo nội dung hợp đồng đã được ký kết với chủ đầu tư","b":"Chịu trách nhiệm về chất lượng công việc theo hợp đồng đã được ký kết;","c":"Bồi thường thiệt hại khi sử dụng thông tin, tài liệu, tiêu chuẩn, quy chuẩn kỹ thuật, giải pháp kỹ thuật, tổ chức quản lý không phù hợp và vi phạm hợp đồng làm thiệt hại cho chủ đầu tư","d":"Bao gồm a, b và c"},"ans":"d","section":"phap_luat"},{"q":"Hồ sơ của hợp đồng xây dựng gồm các tài liệu nào dưới đây?","opts":{"a":"Văn bản thông báo trúng thầu hoặc chỉ định thầu","b":"Các bản vẽ thiết kế và chỉ dẫn kỹ thuật (nếu có), Biên bản đàm phán hợp đồng","c":"Bao gồm đáp án a và b","d":"Không cần các tài liệu quy định tại a và b"},"ans":"c","section":"phap_luat"},{"q":"Hợp đồng xây dựng có hiệu lực pháp lý khi đáp ứng các điều kiện nào sau đây?","opts":{"a":"Người tham gia ký kết có đầy đủ năng lực hành vi dân sự;","b":"Đáp ứng các nguyên tắc ký kết hợp đồng theo quy định","c":"Hình thức hợp đồng bằng văn bản và được ký kết bởi người đại diện đúng thẩm quyền theo pháp luật của các bên tham gia hợp đồng.","d":"Cần đáp ứng đầy đủ các điều kiện ở trên"},"ans":"d","section":"phap_luat"},{"q":"Đối với dự án đầu tư xây dựng sử dụng vốn đầu tư công thì Báo cáo nghiên cứu tiền khả thi đầu tư xây dựng được lập theo quy định nào?","opts":{"a":"Pháp luật về xây dựng","b":"Pháp luật về đầu tư công","c":"Pháp luật về xây dựng và pháp luật về đầu tư công","d":"Pháp luật về đầu tư công, pháp luật về đầu tư, pháp luật xây dựng"},"ans":"c","section":"phap_luat"},{"q":"Hội đồng thẩm định hoặc đơn vị được giao nhiệm vụ thẩm định dự án PPP thẩm định Báo cáo nghiên cứu khả thi dự án PPP theo quy định của pháp luật nào sau đây?","opts":{"a":"Pháp luật về đầu tư xây dựng","b":"Pháp luật về đầu tư theo phương thức đối tác công tư","c":"Pháp luật về đầu tư công","d":"Pháp luật về đầu tư và đầu tư công"},"ans":"b","section":"phap_luat"},{"q":"Việc quyết định đầu tư xây dựng của người quyết định đầu tư được thể hiện tại quyết định phê duyệt dự án đầu tư xây dựng, không bao gồm nội dung nào sau đây?","opts":{"a":"Tổ chức tư vấn lập Báo cáo nghiên cứu khả thi (Báo cáo kinh tế - kỹ thuật) đầu tư xây dựng, tổ chức lập khảo sát xây dựng (nếu có); tổ chức tư vấn lập thiết kế cơ sở;","b":"Địa điểm xây dựng và diện tích đất sử dụng;","c":"Phương án lựa chọn nhà thầu;","d":"Loại, nhóm dự án; loại, cấp công trình chính; thời hạn sử dụng theo thiết kế của công trình chính;"},"ans":"c","section":"phap_luat"},{"q":"Cơ quan chuyên môn về xây dựng từ chối tiếp nhận hồ sơ trình thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng trong trường hợp nào sau đây?","opts":{"a":"Trình thẩm định không đúng với thẩm quyền của cơ quan chuyên môn về xây dựng hoặc người đề nghị thẩm định không đúng thẩm quyền theo quy định","b":"Không thuộc đối tượng phải thẩm định tại cơ quan chuyên môn về xây dựng theo quy định","c":"Hồ sơ trình thẩm định không bảo đảm về tính pháp lý hoặc không hợp lệ theo quy định","d":"Tất cả các trường hợp trên"},"ans":"d","section":"phap_luat"},{"q":"Trong trường hợp thuê tư vấn quản lý dự án, chủ đầu tư có trách nhiệm như thế nào là đúng sau đây?","opts":{"a":"Giám sát việc thực hiện hợp đồng tư vấn quản lý dự án;","b":"Xử lý các vấn đề có liên quan giữa tổ chức tư vấn quản lý dự án với các nhà thầu trong quá trình thực hiện dự án;","c":"Giám sát việc thực hiện hợp đồng của các nhà thầu thi công và giám sát thi công","d":"Xử lý các vấn đề có liên quan giữa tổ chức tư vấn quản lý dự án với chính quyền địa phương trong quá trình thực hiện dự án;"},"ans":"a","section":"phap_luat"},{"q":"Cá nhân đề nghị cấp chứng chỉ hành nghề hoạt động xây dựng yêu cầu phải đáp ứng các điều kiện chung gì?","opts":{"a":"Có đủ năng lực hành vi dân sự theo quy định của pháp luật","b":"Có trình độ chuyên môn được đào tạo, thời gian và kinh nghiệm tham gia công việc phù hợp với nội dung đề nghị cấp chứng chỉ hành nghề và phải đạt kết quả sát hạch theo quy định","c":"Bao gồm a và b","d":"Chỉ cần đạt được kết quả sát hạch theo quy định là đủ"},"ans":"c","section":"phap_luat"},{"q":"Tổ chức đề nghị cấp chứng chỉ năng lực hoạt động xây dựng yêu cầu phải đáp ứng các điều kiện gì?","opts":{"a":"Những cá nhân chủ chốt của tổ chức phải có chứng chỉ hành nghề phù hợp với lĩnh vực và hạng năng lực mà tổ chức đề nghị cấp chứng chỉ năng lực","b":"Tổ chức đã thực hiện công việc tương tự loại, cấp công trình","c":"Phải có thời gian tham gia hoạt động xây dựng tối thiểu 3 năm","d":"Đáp ứng cả điều kiện a và b ở trên"},"ans":"d","section":"phap_luat"},{"q":"Nhà thầu phụ phải chịu trách nhiệm với ai về công việc do mình thực hiện?","opts":{"a":"Chủ đầu tư","b":"Thầu chính hoặc tổng thầu","c":"Chủ đầu tư và thầu chính hoặc tổng thầu","d":"Chịu trách nhiệm với ai là căn cứ vào các điều khoản cam kết trong hợp đồng xây dựng"},"ans":"b","section":"phap_luat"},{"q":"Trường hợp phải thuê thầu phụ để thực hiện một số phần việc trong hợp đồng đã ký kết với chủ đầu tư thì cần phải có chấp thuận của ai?","opts":{"a":"Người quyết định đầu tư","b":"Chủ đầu tư","c":"Người quyết định đầu tư hoặc chủ đầu tư tùy thuộc vào từng gói thầu","d":"Không cần phải có sự chấp thuận của cơ quan, tổ chức nào"},"ans":"b","section":"phap_luat"},{"q":"Bảo đảm thực hiện hợp đồng xây dựng phải được nộp cho bên giao thầu khi nào?","opts":{"a":"Trước thời điểm hợp đồng có hiệu lực","b":"Sau khi hợp đồng được ký kết","c":"Trước khi khởi công xây dựng công trình","d":"Bao gồm cả a, b và c"},"ans":"a","section":"phap_luat"},{"q":"Bảo đảm thực hiện hợp đồng của nhà thầu thi công xây dựng có hiệu lực đến khi nào?","opts":{"a":"Đến khi nhà thầu đã hoàn thành các nghĩa vụ theo hợp đồng","b":"Sau khi chủ đầu tư đã nhận được bảo đảm bảo hành của nhà thầu","c":"Đáp án a hoặc b do hai bên thỏa thuận trong hợp đồng","d":"Sau khi công việc theo hợp đồng đã hoàn thành bàn giao cho chủ đầu tư"},"ans":"c","section":"phap_luat"},{"q":"Cá nhân không có chứng chỉ hành nghề được tham gia các hoạt động xây dựng theo quy định nào sau đây là đúng?","opts":{"a":"Được tham gia các hoạt động xây dựng thuộc lĩnh vực phù hợp với chuyên ngành được đào tạo, phù hợp với quy định của Bộ luật Lao động","b":"Không được hành nghề độc lập, không được đảm nhận chức danh theo quy định phải có chứng chỉ hành nghề.","c":"Tuân thủ cả quy định a và b","d":"Được tham gia các hoạt động xây dựng đối với những dự án nhóm C, công trình cấp II trở xuống"},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật xây dựng, cá nhân khi thực hiện các hoạt động xây dựng nào sau đây không cần phải có chứng chỉ hành nghề?","opts":{"a":"Thiết kế, giám sát hệ thống thông tin liên lạc, viễn thông trong công trình","b":"Thiết kế, giám sát thi công hệ thống kết cấu công trình xây dựng","c":"Không nội dung nào ở trên","d":"Cả a và b đúng"},"ans":"a","section":"phap_luat"},{"q":"Tổ chức hoạt động xây dựng mới được thành lập có những cá nhân có chứng chỉ hành nghề hạng 1 phù hợp với lĩnh vực mà tổ chức đề nghị cấp chứng chỉ năng lực hoạt động xây dựng, nhưng chưa ký hợp đồng để thực hiện bất kể công việc gì trong hoạt động đầu tư xây dựng thì có được cấp chứng chỉ năng lực hoạt động xây dựng hạng 1 không?","opts":{"a":"Có","b":"Không","c":"Có, nhưng chỉ được xem cấp chứng chỉ hành năng lực cho lĩnh vực định giá xây dựng","d":"Có, nhưng chỉ được xem cấp chứng chỉ hành năng lực cho các lĩnh vực giám sát thi công xây dựng, kiểm định xây dựng"},"ans":"b","section":"phap_luat"},{"q":"Bước thiết kế công trình xây dựng nào mới đủ điều kiện để khởi công xây dựng công trình?","opts":{"a":"Thiết kế cơ sở","b":"Thiết kế kỹ thuật","c":"Thiết kế bản vẽ thi công","d":"Một trong ba bước thiết kế trên đều được"},"ans":"c","section":"phap_luat"},{"q":"Đô thị được định nghĩa như thế nào theo Luật Quy hoạch đô thị và nông thôn?","opts":{"a":"Nơi sinh sống của cộng đồng dân cư chủ yếu hoạt động trong lĩnh vực nông nghiệp","b":"Nơi tập trung dân cư sinh sống có mật độ cao và chủ yếu hoạt động trong lĩnh vực phi nông nghiệp; là trung tâm chính trị, hành chính, kinh tế, văn hóa hoặc chuyên ngành, có vai trò thúc đẩy phát triển kinh tế - xã hội của quốc gia hoặc một vùng lãnh thổ","c":"Một khu vực chức năng trong đô thị, bao gồm các công trình hạ tầng xã hội","d":"Nơi sinh sống của cộng đồng dân cư với mật độ thấp, chủ yếu hoạt động trong lĩnh vực lâm nghiệp."},"ans":"b","section":"phap_luat"},{"q":"Không gian đô thị, nông thôn được định nghĩa như thế nào theo Luật Quy hoạch đô thị và nông thôn?","opts":{"a":"Không gian trên mặt đất tại các khu đô thị và khu vực nông thôn","b":"Không gian trên mặt đất và dưới mặt đất tại các đô thị, nông thôn, không bao gồm không gian dưới nước","c":"Không gian trên mặt đất, dưới mặt đất, dưới nước tại đô thị, nông thôn","d":"Không gian xây dựng các công trình hạ tầng kỹ thuật và xã hội tại đô thị"},"ans":"c","section":"phap_luat"},{"q":"Chỉ tiêu kinh tế - kỹ thuật trong quy hoạch được định nghĩa như thế nào?","opts":{"a":"Là các chỉ tiêu được xác định để phát triển kinh tế, không liên quan đến kỹ thuật","b":"Là các chỉ tiêu được dự báo, xác định, lựa chọn trong quy hoạch làm cơ sở đề xuất các phương án, giải pháp quy hoạch gồm quy mô dân số, lao động, quy mô đất đai, các chỉ tiêu về hạ tầng kỹ thuật, hạ tầng xã hội và môi trường","c":"Là các chỉ tiêu dự kiến phát triển hạ tầng kỹ thuật và kinh tế mà không phụ thuộc vào các yếu tố xã hội","d":"Là các chỉ tiêu tập trung vào quy mô dân số và quy mô đất đai"},"ans":"b","section":"phap_luat"},{"q":"Khu dân cư nông thôn được định nghĩa như thế nào theo Luật Quy hoạch đô thị và nông thôn?","opts":{"a":"Là nơi tập trung sinh sống của các hộ gia đình chủ yếu hoạt động trong lĩnh vực phi nông nghiệp","b":"Là nơi cư trú tập trung của các hộ gia đình gắn kết với nhau trong sản xuất, sinh hoạt và các hoạt động xã hội khác trong phạm vi một khu vực nhất định ở nông thôn, được hình thành do điều kiện tự nhiên, kinh tế - xã hội và hạ tầng kỹ thuật","c":"Là nơi sinh sống của cộng đồng dân cư chủ yếu hoạt động trong lĩnh vực công nghiệp","d":"Là một khu chức năng thuộc phạm vi đô thị"},"ans":"b","section":"phap_luat"},{"q":"Theo quy định của pháp luật xây dựng Việt Nam, công trình xây dựng được phân thành mấy cấp?","opts":{"a":"04 cấp (Cấp I, cấp II, cấp III, cấp IV).","b":"05 cấp (Cấp đặc biệt, cấp I, cấp II, cấp III, cấp IV) trừ các trường hợp khác được quy định trong quy chuẩn kỹ thuật hoặc quy định của pháp luật khác liên quan","c":"06 cấp (Cấp đặc biệt, cấp I, cấp II, cấp III, cấp IV, cấp V) trừ các trường hợp khác theo quy định của pháp luật khác liên quan.","d":"07 cấp (Cấp đặc biệt, cấp I, cấp II, cấp III, cấp IV, cấp V, công trình tạm)"},"ans":"b","section":"phap_luat"},{"q":"Theo quy định của pháp luật xây dựng Việt Nam, nhóm các công trình nào sau đây thuộc hệ thống công trình hạ tầng xã hội?","opts":{"a":"Công trình cấp nước, thu gom và xử lý nước thải.","b":"Khu công nghệ cao, khu chế xuất, khu công nghiệp.","c":"Trường học, bệnh viện, công viên, dịch vụ công cộng.","d":"Cả ba đáp án a, b, c."},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật xây dựng Việt Nam, giấy phép xây dựng là văn bản pháp lý do cơ quan nhà nước có thẩm quyền cấp cho đối tượng nào sau đây?","opts":{"a":"Chủ đầu tư.","b":"Nhà thầu thi công xây dựng.","c":"Nhà thầu tư vấn.","d":"Cả ba đáp án a, b, c."},"ans":"a","section":"phap_luat"},{"q":"Cơ quan nào có trách nhiệm tổ chức lập quy hoạch xây dựng?","opts":{"a":"Bộ Xây dựng và Ủy ban nhân dân các cấp","b":"Ủy ban nhân dân các cấp","c":"Bộ Xây dựng và Chủ đầu tư dự án","d":"Ủy ban nhân dân các cấp và Chủ đầu tư dự án"},"ans":"a","section":"phap_luat"},{"q":"Loại nào dưới đây là Quy hoạch xây dựng?","opts":{"a":"Quy hoạch bảo quản, tu bổ, phục hồi di tích;","b":"Quy hoạch khu chức năng đặc thù;","c":"Quy hoạch đô thị;","d":"Quy hoạch chi tiết nhóm cảng biển, bến cảng, cầu cảng, bến phao, khu nước, vùng nước."},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật xây dựng Việt Nam, dự án xây dựng công trình rạp chiếu phim được phân loại là dự án đầu tư xây dựng nào?","opts":{"a":"Dự án đầu tư xây dựng công trình công cộng","b":"Dự án đầu tư xây dựng công trình dịch vụ","c":"Dự án đầu tư xây dựng có công năng phục vụ hỗn hợp","d":"Dự án đầu tư xây dựng công trình hạ tầng kỹ thuật"},"ans":"a","section":"phap_luat"},{"q":"Các bộ phận chi tiết kiến trúc nào của công trình được vượt quá chỉ giới đường đỏ theo quy định của pháp luật về xây dựng ở Việt Nam?","opts":{"a":"Các chi tiết kiến trúc của công trình do đồ án quy hoạch chi tiết, thiết kế đô thị quy định.","b":"Không một bộ phận, chi tiết kiến trúc nào của công trình được vượt quá chỉ giới đường đỏ.","c":"Có thể xây dựng các bộ phận, chi tiết kiến trúc như bậc thềm, vệt dắt xe, ram dốc, bậu cửa, ô văng, mái đua… vượt quá chỉ giới đường đỏ nhưng phải đảm bảo tuân thủ các quy định về phòng cháy chữa cháy và hoạt động của phương tiện chữa cháy.","d":"Có thể xây dựng các bộ phận, chi tiết kiến trúc vượt quá chỉ giới đường đỏ nhưng phải đảm bảo tính thống nhất về cảnh quan trên tuyến phố hoặc từng đoạn phố"},"ans":"b","section":"phap_luat"},{"q":"Theo pháp luật Việt Nam thì việc áp dụng tiêu chuẩn, quy chuẩn trong hoạt động xây dựng theo nguyên tắc nào?","opts":{"a":"Tiêu chuẩn được áp dụng trong hoạt động đầu tư xây dựng theo nguyên tắc bắt buộc theo quyết định đầu tư.","b":"Phù hợp với yêu cầu của quy chuẩn kinh tế kỹ thuật và quy định của pháp luật về đầu tư xây dựng.","c":"Tiêu chuẩn được áp dụng trong hoạt động đầu tư xây dựng theo nguyên tắc tự nguyện, phải được người quyết định đầu tư xem xét, chấp thuận khi quyết định đầu tư.","d":"Tiêu chuẩn được áp dụng trong hoạt động đầu tư xây dựng đáp ứng yêu cầu của nhà thầu thi công xây dựng."},"ans":"c","section":"phap_luat"},{"q":"Theo quy định của pháp luật xây dựng Việt Nam, quy hoạch xây dựng gồm có mấy loại?","opts":{"a":"2 loại: Quy hoạch xây dựng đô thị; quy hoạch nông thôn.","b":"3 loại: Quy hoạch vùng; quy hoạch đô thị; quy hoạch nông thôn.","c":"3 loại: Quy hoạch xây dựng vùng liên huyện, vùng huyện và khu chức năng; quy hoạch đô thị; quy hoạch nông thôn.","d":"4 loại: Quy hoạch chung xây dựng đô thị; quy hoạch phân khu xây dựng đô thị; quy hoạch chi tiết xây dựng đô thị; quy hoạch nông thôn."},"ans":"c","section":"phap_luat"},{"q":"Khái niệm đầy đủ về chỉ giới đường đỏ trong xây dựng là gì?","opts":{"a":"Là đường ranh giới được xác định trên bản đồ quy hoạch vùng và địa hình để phân định ranh giới giữa phần đất được xây dựng công trình và phần đất được dành cho đường giao thông hoặc công trình hạ tầng kỹ thuật, không gian công cộng khác.","b":"Là đường ranh giới được xác định trên thực địa để phân định ranh giới giữa phần đất không được xây dựng công trình và phần đất không được dành cho đường giao thông hoặc công trình hạ tầng kỹ thuật, không gian công cộng khác.","c":"Là đường xác định trên bản đồ quy hoạch và thực địa để phân định ranh giới giữa phần đất được xây dựng công trình và phần đất được dành cho đường giao thông hoặc công trình hạ tầng kỹ thuật.","d":"Là đường ranh giới được xác định trên bản đồ quy hoạch và thực địa để phân định ranh giới giữa phần đất được xây dựng công trình và phần đất được dành cho đường giao thông hoặc công trình hạ tầng kỹ thuật, không gian công cộng khác."},"ans":"d","section":"phap_luat"},{"q":"Để được cấp chứng chỉ hành nghề hoạt động xây dựng, cá nhân phải đáp ứng được điều kiện gì?","opts":{"a":"Có trình độ chuyên môn phù hợp với nội dung đề nghị cấp chứng chỉ hành nghề","b":"Có thời gian và kinh nghiệm tham gia công việc phù hợp với nội dung đề nghị cấp chứng chỉ hành nghề","c":"Đã qua sát hạch kiểm tra kinh nghiệm nghề nghiệp và kiến thức pháp luật liên quan đến lĩnh vực hành nghề","d":"Tất cả các điều kiện trên"},"ans":"d","section":"phap_luat"},{"q":"Cơ quan nào có trách nhiệm tổ chức lập quy hoạch xây dựng?","opts":{"a":"Bộ Xây dựng","b":"Ủy ban nhân dân các cấp","c":"Chủ đầu tư dự án","d":"Bộ Xây dựng và Ủy ban nhân dân các cấp"},"ans":"d","section":"phap_luat"},{"q":"Loại nào dưới đây là Quy hoạch xây dựng?","opts":{"a":"Quy hoạch bảo quản, tu bổ, phục hồi di tích;","b":"Quy hoạch khu chức năng đặc thù;","c":"Quy hoạch hệ thống đô thị và nông thôn;","d":"Quy hoạch chi tiết nhóm cảng biển, bến cảng, cầu cảng, bến phao, khu nước, vùng nước."},"ans":"b","section":"phap_luat"},{"q":"Công tác quy hoạch xây dựng bao gồm những công việc chủ yếu nào sau đây?","opts":{"a":"Lập, phê duyệt nhiệm vụ và lập, phê duyệt đồ án quy hoạch xây dựng","b":"Tổ chức triển khai, quản lý thực hiện theo quy hoạch được duyệt","c":"Lập, xác định chi phí cho công tác quy hoạch","d":"Tất cả các nội dung trên"},"ans":"d","section":"phap_luat"},{"q":"Cấp nào có thẩm quyền phê duyệt nhiệm vụ và đồ án quy hoạch xây dựng khu công nghệ cao?","opts":{"a":"Thủ tướng Chính phủ","b":"Bộ Xây dựng","c":"Hội đồng nhân dân các huyện trong vùng lập quy hoạch","d":"Ủy ban nhân dân cấp Tỉnh"},"ans":"a","section":"phap_luat"},{"q":"Cơ quan nào có thẩm quyền phê duyệt quy hoạch xây dựng vùng huyện?","opts":{"a":"Ủy ban nhân dân tỉnh","b":"Ủy ban nhân dân huyện","c":"Hội đồng nhân dân tỉnh","d":"Bộ Xây dựng"},"ans":"a","section":"phap_luat"},{"q":"Ủy ban nhân dân cấp Tỉnh có thẩm quyền phê duyệt các quy hoạch nào dưới đây?","opts":{"a":"Toàn bộ các quy hoạch liệt kê dưới đây","b":"Quy hoạch xây dựng vùng liên huyện,","c":"Quy hoạch chung xây dựng khu chức năng, trừ các quy hoạch do Thủ tướng Chính phủ phê duyệt","d":"Quy hoạch xây dựng vùng huyện;"},"ans":"a","section":"phap_luat"},{"q":"Quy hoạch xây dựng vùng liên huyện, quy hoạch xây dựng vùng huyện được điều chỉnh khi thuộc trường hợp sau đây?","opts":{"a":"Có sự điều chỉnh mục tiêu của chiến lược phát triển kinh tế - xã hội, chiến lược phát triển ngành, lĩnh vực làm thay đổi mục tiêu của quy hoạch;","b":"Có sự điều chỉnh của quy hoạch cao hơn làm thay đổi nội dung quy hoạch hoặc có sự mâu thuẫn với quy hoạch cùng cấp;","c":"Có sự thay đổi, điều chỉnh địa giới hành chính làm ảnh hưởng đến tính chất, quy mô không gian lãnh thổ của quy hoạch;","d":"Khi thuộc một trong các trường hợp ở trên"},"ans":"d","section":"phap_luat"},{"q":"Trình tự lập, phê duyệt quy hoạch xây dựng?","opts":{"a":"Lập, phê duyệt Nhiệm vụ quy hoạch xây dựng - Lập, phê duyệt đồ án quy hoạch xây dựng","b":"Lập, phê duyệt Nhiệm vụ quy hoạch xây dựng - Điều tra, khảo sát thực địa, thu thập bản đồ, tài liệu, số liệu về hiện trạng - Lập, phê duyệt đồ án quy hoạch xây dựng","c":"Điều tra, khảo sát thực địa, thu thập bản đồ, tài liệu, số liệu về hiện trạng - Lập, phê duyệt đồ án quy hoạch xây dựng","d":"Lập, phê duyệt Nhiệm vụ quy hoạch xây dựng - Điều tra, khảo sát thực địa, thu thập bản đồ, tài liệu, số liệu về hiện trạng - Lập đồ án quy hoạch xây dựng - Thẩm định, phê duyệt đồ án quy hoạch xây dựng"},"ans":"d","section":"phap_luat"},{"q":"Quy hoạch xây dựng vùng liên huyện được lập khi nào?","opts":{"a":"Theo đề xuất của Sở Xây dựng phù hợp với quy hoạch vùng, quy hoạch tỉnh","b":"Nhằm đáp ứng yêu cầu quản lý, định hướng phát triển, xác định vai trò của từng đơn vị hành chính cấp huyện, xã, thị trấn và các đô thị trong tổng thể phát triển chung của vùng liên huyện, đảm bảo phân bổ nguồn lực quốc gia, tỉnh có hiệu quả","c":"Được ủy ban nhân dân cấp tỉnh quyết định","d":"Có đầy đủ các cơ sở trên"},"ans":"d","section":"phap_luat"},{"q":"Tỷ lệ bản vẽ hồ sơ đồ án quy hoạch xây dựng vùng liên huyện nào đúng?","opts":{"a":"1/500.000","b":"1/25.000 - 1/500.000","c":"1/25.000 - 1/100.000","d":"1/50.000 - 1/250.000"},"ans":"d","section":"phap_luat"},{"q":"Tỷ lệ diện tích chiếm đất của các công trình kiến trúc chính trên diện tích lô đất (không bao gồm diện tích chiếm đất của các công trình ngoài trời như tiểu cảnh trang trí, bể bơi, bãi (sân) đỗ xe, sân thể thao, công trình hạ tầng kỹ thuật) được xác định là khái niệm nào sau đây?","opts":{"a":"Mật độ xây dựng thuần","b":"Mật độ xây dựng gộp","c":"Cả 2 đáp án trên là đúng","d":"Cả 2 đáp án trên là sai"},"ans":"a","section":"phap_luat"},{"q":"Yêu cầu về dự báo trong đồ án quy hoạch không bao gồm nội dung nào sau đây?","opts":{"a":"Dự báo phải đề cập đến các vấn đề về tai biến thiên nhiên, môi trường, biến đổi khí hậu và nước biển dâng;","b":"Quy hoạch phân khu, quy hoạch chi tiết phải tuân thủ và cụ thể hóa các dự báo của toàn đô thị;","c":"Dự báo về dân số, lao động, đất đai dựa trên cơ sở chuỗi các số liệu với thời gian tối thiểu của 2 năm gần nhất;","d":"Kết quả của dự báo phải đảm bảo phù hợp với khả năng dung nạp, đáp ứng của đất đai, hạ tầng xã hội, hạ tầng kỹ thuật và môi trường."},"ans":"c","section":"phap_luat"},{"q":"Những cá nhân nào sau đây bắt buộc phải có chứng chỉ hành nghề trong hồ sơ năng lực thực hiện một đồ án quy hoạch xây dựng?","opts":{"a":"Chủ nhiệm đồ án và Chủ trì các bộ môn","b":"Chủ nhiệm đồ án","c":"Chủ trì phần kiến trúc","d":"Tất cả các thành viên tham gia thực hiện đồ án quy hoạch xây dựng"},"ans":"a","section":"phap_luat"},{"q":"Căn cứ để lập đồ án quy hoạc s":"a","section":"chuyen_mon"},{"q":"Theo Quy chuẩn QCVN 01:2021/BXD, trường hợp các công trình có chiều cao ≥ 46 m, yêu cầu khoảng cách tối thiểu của công trình đối với xung quanh là phương án nào dưới đây?","opts":{"a":"Khoảng cách giữa cạnh dài của các công trình phải > 25 m, giữa đầu hồi của công trình với đầu hồi hoặc cạnh dài của công trình khác phải đảm bảo > 15 m.","b":"Khoảng cách giữa cạnh dài của các công trình phải ≥ 25 m, giữa đầu hồi của công trình với đầu hồi hoặc cạnh dài của công trình khác phải đảm bảo > 15 m.","c":"Khoảng cách giữa cạnh dài của các công trình phải ≥ 25 m, giữa đầu hồi của công trình với đầu hồi hoặc cạnh dài của công trình khác phải đảm bảo ≥ 15 m.","d":"Khoảng cách giữa cạnh dài của các công trình phải > 25 m, giữa đầu hồi của công trình với đầu hồi hoặc cạnh dài của công trình khác phải đảm bảo ≥ 15 m."},"ans":"c","section":"chuyen_mon"},{"q":"Những cá nhân nào sau đây bắt buộc phải có chứng chỉ hành nghề trong hồ sơ năng lực thực hiện một đồ án quy hoạch xây dựng?","opts":{"a":"Chủ nhiệm đồ án và chủ trì các bộ môn","b":"Chủ nhiệm đồ án","c":"Chủ trì phần thiết kế quy hoạch","d":"Tất cả các thành viên tham gia thực hiện đồ án quy hoạch xây dựng"},"ans":"a","section":"chuyen_mon"},{"q":"Theo Nghị định 15/2021/NĐ-CP, Giấy phép xây dựng được cấp lại trong trường hợp:","opts":{"a":"Giấy phép xây dựng bị rách, bị nát hoặc bị mất","b":"Giấy phép xây dựng bị quá hạn","c":"Giấy phép xây dựng bị hủy","d":"Giấy phép xây dựng bị quá hạn, bị hủy hoặc bị thu hồi"},"ans":"a","section":"chuyen_mon"},{"q":"Theo Nghị định 15/2021/NĐ-CP, chủ đầu tư có trách nhiệm công khai giấy phép xây dựng tại đâu?","opts":{"a":"Chủ đầu tư có trách nhiệm công khai giấy phép xây dựng trên trang thông tin điện tử của mình","b":"Chủ đầu tư có trách nhiệm công khai giấy phép xây dựng trên các phương tiện thông tin đại chúng","c":"Chủ đầu tư có trách nhiệm công khai giấy phép xây dựng tại địa điểm thi công xây dựng trong suốt quá trình thi công xây dựng","d":"Chủ đầu tư có trách nhiệm công khai giấy phép xây dựng trên trang thông tin điện tử của mình và tại địa điểm thi công xây dựng."},"ans":"c","section":"chuyen_mon"},{"q":"Theo Nghị định 15/2021/NĐ-CP, việc Quản lý trật tự xây dựng được thực hiện từ khi nào?","opts":{"a":"Từ khi khởi công xây dựng công trình cho đến khi công trình bàn giao đưa vào sử dụng","b":"Từ khi tiếp nhận thông báo khởi công, khởi công xây dựng công trình cho đến khi xây dựng công trình","c":"Từ khi tiếp nhận thông báo khởi công, khởi công xây dựng công trình cho đến khi công trình bàn giao đưa vào sử dụng","d":"Từ khi tiếp nhận thông báo khởi công, cho đến khi xây dựng công trình, bàn giao đưa vào sử dụng và cả quá trình khai thác công trình."},"ans":"c","section":"chuyen_mon"},{"q":"Theo quy định của pháp luật về xây dựng, chứng chỉ hành nghề được cấp cho cá nhân là công dân Việt Nam có hiệu lực tối đa trong bao lâu?","opts":{"a":"3 năm","b":"4 năm","c":"5 năm","d":"Theo giấy phép lao động nhưng không quá 5 năm"},"ans":"c","section":"chuyen_mon"},{"q":"Theo quy định của pháp luật về xây dựng, điều kiện để lập quy hoạch chung khu chức năng là gì?","opts":{"a":"Khu chức năng có diện tích 200 ha trở lên","b":"Khu chức năng có diện tích 300 ha trở lên","c":"Khu chức năng có diện tích 400 ha trở lên","d":"Khu chức năng có diện tích 500 ha trở lên"},"ans":"d","section":"chuyen_mon"},{"q":"Theo quy định của pháp luật xây dựng Việt Nam hiện hành thì có cần lập quy hoạch chi tiết đối với dự án đầu tư xây dựng có quy mô nhỏ hơn 5 ha hay không?","opts":{"a":"Bắt buộc phải thực hiện việc lập quy hoạch chi tiết tuy nhiên có thể lập theo quy trình rút gọn.","b":"Có thể lập dự án đầu tư xây dựng mà không phải lập quy hoạch chi tiết.","c":"Chủ đầu tư có thể tổ chức lập quy hoạch chi tiết đối với dự án trong khu vực đã có quy hoạch chung được phê duyệt.","d":"Không bắt buộc phải thực hiện việc lập quy hoạch chi tiết xây dựng nhưng chủ đầu tư có trách nhiệm lấy ý kiến bằng văn bản của cơ quan có thẩm quyền phê duyệt quy hoạch chi tiết xây dựng."},"ans":"a","section":"chuyen_mon"},{"q":"Bản vẽ của đồ án quy hoạch phân khu xây dựng khu chức năng được thể hiện theo tỷ lệ nào?","opts":{"a":"1/2.000.","b":"1/5.000.","c":"1/10.000.","d":"1/25.000."},"ans":"a","section":"chuyen_mon"},{"q":"Bản vẽ của đồ án quy hoạch chung đô thị mới được thể hiện theo tỷ lệ nào?","opts":{"a":"1/5.000 hoặc 1/10.000","b":"1/10.000","c":"1/10.000 hoặc 1/25.000","d":"1/25.000"},"ans":"c","section":"chuyen_mon"},{"q":"Thời hạn quy hoạch đối với quy hoạch chung đô thị mới là bao nhiêu năm?","opts":{"a":"10 đến 20 năm","b":"20 đến 25 năm","c":"20 đến 30 năm","d":"10 đến 25 năm"},"ans":"b","section":"chuyen_mon"},{"q":"Theo Quy chuẩn kỹ thuật quốc gia về Quy hoạch xây dựng QCVN01:2021/BXD, yêu cầu về quy hoạch không gian xanh, đất cây xanh trong đô thị không cần phải đáp ứng yêu cầu nào sau đây?","opts":{"a":"Không gian cây xanh trong đô thị, bao gồm không gian xanh tự nhiên và không gian xanh nhân tạo phải được quy hoạch gắn kết với nhau thành một hệ thống liên hoàn","b":"Các chỉ tiêu đất cây xanh công cộng cho toàn đô thị và từng khu vực được xác định trong quy hoạch chung, quy hoạch phân khu phải đáp ứng với mục tiêu của quy hoạch và phù hợp đặc thù từng đô thị. Cây xanh sử dụng công cộng phải quy hoạch để đảm bảo mọi người dân tiếp cận thuận lợi.","c":"Phải ưu tiên sử dụng các loại cây xanh bản địa, đặc trưng vùng miền và phù hợp với đô thị, bảo vệ được các cây quý hiếm, cây cổ thụ có giá trị. Chủng loại cây xanh trong đô thị không được làm ảnh hưởng tới an toàn giao thông, phù hợp với các yêu cầu về phòng chống thiên tai, không gây hư hại công trình bao gồm cả phần ngầm và phần trên mặt đất, không tiết ra các chất độc hại hoặc hấp dẫn côn trùng gây ảnh hưởng đến dân cư","d":"Không gian xanh tự nhiên cần được bảo vệ tối đa, không gian xanh nhân tạo phải được thiết kế đảm bảo giá trị đặc trưng của từng khu vực và phân bố hợp lý trên toàn diện tích đất xây dựng đô thị để đảm bảo thuận lợi trong sử dụng. Ưu tiên bảo tồn và bảo vệ và trồng các loại cây quý hiếm có giá trị."},"ans":"d","section":"chuyen_mon"},{"q":"Theo QCVN01:2021/BXD, yêu cầu về quy hoạch không gian xây dựng ngầm cần phải đáp ứng yêu cầu nào sau đây?","opts":{"a":"Phải xác định được khu vực xây dựng, khu vực hạn chế xây dựng, khu vực cấm xây dựng công trình ngầm","b":"Phải xác định được vị trí, quy mô, hướng tuyến, phân tầng của hệ thống giao thông ngầm, hệ thống tuy-nen, hào kỹ thuật, cống bể kỹ thuật, các khu vực xây dựng công trình công cộng, công trình đầu mối hạ tầng kỹ thuật ngầm và dự kiến đấu nối kỹ thuật, đấu nối không gian","c":"Các công trình ngầm phải đảm bảo kết nối an toàn, đồng bộ với nhau và với các công trình trên mặt đất về không gian và đấu nối hạ tầng kỹ thuật","d":"Tất cả các đáp án trên"},"ans":"d","section":"chuyen_mon"},{"q":"Theo QCVN01:2021/BXD, yêu cầu về mức độ thể hiện đồ án quy hoạch nào là đúng?","opts":{"a":"Tỷ lệ bản đồ 1/25000 phải thể hiện đến cấp đường liên khu vực hoặc tương đương và ô đất giới hạn bởi các đường liên khu vực hoặc tương đương","b":"Tỷ lệ bản đồ 1/5000 phải thể hiện đến cấp đường chính khu vực hoặc tương đương và ô đất giới hạn bởi các đường chính khu vực hoặc tương đương","c":"Tỷ lệ bản đồ 1/10000 phải thể hiện đến cấp đường đường khu vực hoặc tương đương và ô đất giới hạn bởi các đường khu vực hoặc tương đương","d":"Tất cả các đáp án trên"},"ans":"a","section":"chuyen_mon"},{"q":"Theo QCVN01:2021/BXD, yêu cầu về mức độ thể hiện đồ án quy hoạch nào là đúng?","opts":{"a":"Tỷ lệ bản đồ 1/25.000 phải thể hiện đến cấp đường chính khu vực hoặc tương đương và ô đất giới hạn bởi các đường chính khu vực hoặc tương đương","b":"Tỷ lệ bản đồ 1/2.000 phải thể hiện đến cấp đường phân khu vực và ô đất giới hạn bởi các đường phân khu vực","c":"Tỷ lệ bản đồ 1/5.000 phải thể hiện đến cấp đường chính khu vực hoặc tương đương và ô đất giới hạn bởi các đường chính khu vực hoặc tương đương","d":"Tỷ lệ bản đồ 1/10.000 phải thể hiện đến cấp đường đường khu vực hoặc tương đương và ô đất giới hạn bởi các đường khu vực hoặc tương đương"},"ans":"b","section":"chuyen_mon"},{"q":"Theo QCVN01:2021/BXD, yêu cầu đối với các phân khu trong đô thị nào là đúng?","opts":{"a":"Các phân khu trong đô thị phải được tính toán, dự báo theo khả năng phát triển theo từng giai đoạn quy hoạch và được quy hoạch gắn kết với nhau thành một hệ thống liên hoàn","b":"Phân khu trong đô thị phải dựa trên các giá trị đặc trưng trong từng khu vực về điều kiện tự nhiên, kiến trúc cảnh quan và chức năng đô thị.","c":"Phân khu trong đô thị phải xác định được hệ thống công trình hạ tầng xã hội và hệ thống hạ tầng kỹ thuật cấp khu vực.","d":"Tất cả các đáp án trên"},"ans":"b","section":"chuyen_mon"},{"q":"Yêu cầu lựa chọn đất xây dựng đô thị nào sau đây là sai?","opts":{"a":"Có các lợi thế về kinh tế, xã hội, hạ tầng kỹ thuật và môi trường","b":"Có đủ diện tích đất để phát triển đô thị trong giai đoạn 10 đến 15 năm","c":"Không thuộc phạm vi khu vực được xác định để khai thác mỏ, bảo tồn thiên nhiên","d":"Không nằm trong phạm vi cấm xây dựng theo pháp luật về xây dựng"},"ans":"b","section":"chuyen_mon"},{"q":"Cấu trúc phát triển không gian đô thị không bao hàm yếu tố nào?","opts":{"a":"Hình thái đô thị","b":"Kinh tế đô thị","c":"Quản lý đô thị","d":"Sinh thái đô thị"},"ans":"c","section":"chuyen_mon"},{"q":"Cấu trúc phát triển không gian đô thị xác định trên cơ sở nào?","opts":{"a":"Khung thiên nhiên của đô thị; Các điều kiện hiện trạng; Tiềm năng phát triển đô thị;","b":"Các điều kiện hiện trạng; Tiềm năng phát triển đô thị;","c":"Khung thiên nhiên của đô thị; Các điều kiện hiện trạng;","d":"Khung thiên nhiên của đô thị; Tiềm năng phát triển đô thị;"},"ans":"a","section":"chuyen_mon"},{"q":"Yêu cầu nào không quy định bắt buộc đối với quy hoạch xây dựng công trình công cộng ngầm đô thị?","opts":{"a":"Phải phù hợp với quy hoạch tổ chức không gian và hệ thống dịch vụ công cộng của đô thị","b":"Phải đảm bảo yêu cầu bố trí hỗn hợp nhiều loại chức năng khác nhau","c":"Phải đảm bảo kết nối không gian thuận tiện và an toàn với các công trình giao thông ngầm","d":"Phải đảm bảo kết nối với hệ thống hạ tầng kỹ thuật ngầm chung của đô thị"},"ans":"b","section":"chuyen_mon"},{"q":"Yêu cầu nào không quy định bắt buộc đối với quy hoạch cải tạo các khu vực cũ trong đô thị?","opts":{"a":"Phù hợp với điều kiện hiện trạng về mật độ và tầng cao xây dựng","b":"Phù hợp với giá trị lịch sử, giá trị kiến trúc và chất lượng của các công trình hiện có","c":"Đảm bảo yêu cầu về phòng cháy, chữa cháy, bãi đỗ xe, cơ sở hạ tầng kỹ thuật khác","d":"Đảm bảo quỹ đất dự trữ phát triển"},"ans":"d","section":"chuyen_mon"},{"q":"Quy hoạch cải tạo các khu vực cũ trong đô thị, trong điều kiện nào thì được phép xen cấy thêm các công trình khác?","opts":{"a":"Không được phép xen cấy bất kể điều kiện nào","b":"Được phép xen cấy bất kể điều kiện nào","c":"Khi quy mô trường học đảm bảo chuẩn quốc gia do Bộ Giáo dục và Đào tạo quy định","d":"Khi các công trình trường học, chợ, cây xanh đảm bảo chỉ tiêu về quy mô, bán kính phục vụ"},"ans":"d","section":"chuyen_mon"},{"q":"Quy hoạch xây dựng mới các đơn vị ở mới cần đảm bảo đường giao thông từ cấp nào trở lên không chia cắt đơn vị ở?","opts":{"a":"Đường trục chính đô thị","b":"Đường chính đô thị","c":"Đường liên khu vực","d":"Đường chính khu vực"},"ans":"b","section":"chuyen_mon"},{"q":"Theo chiến lược phát triển nhà ở quốc gia đến năm 2020, tầm nhìn đến năm 2030 đã xác định đến năm 2030 diện tích sàn nhà ở tối thiểu và trung bình toàn quốc tại đô thị là bao nhiêu m²/người?","opts":{"a":"6/26","b":"8/25","c":"12/30","d":"15/30"},"ans":"c","section":"chuyen_mon"},{"q":"Có bao nhiêu yêu cầu đối với việc phân khu chức năng trong quy hoạch điểm dân cư nông thôn?","opts":{"a":"4 yêu cầu","b":"5 yêu cầu","c":"6 yêu cầu","d":"7 yêu cầu"},"ans":"c","section":"chuyen_mon"},{"q":"Tổng chỉ tiêu sử dụng đất (đất ở, đất công cộng, đất giao thông, đất hạ tầng cây xanh) của điểm dân cư nông thôn là:","opts":{"a":"35 m²/người","b":"37 m²/người","c":"40 m²/người","d":"45 m²/người"},"ans":"b","section":"chuyen_mon"},{"q":"Các loại đồ án quy hoạch vùng nào ở Việt Nam được lập theo quyết định của thủ tướng Chính phủ?","opts":{"a":"Vùng liên tỉnh; vùng chức năng đặc thù; vùng dọc tuyến đường cao tốc; hành lang kinh tế liên tỉnh.","b":"Vùng tỉnh; vùng liên huyện.","c":"Vùng huyện; vùng liên xã.","d":"A; B và C"},"ans":"b","section":"chuyen_mon"},{"q":"Thiết kế đô thị là:","opts":{"a":"Một đồ án quy hoạch đô thị.","b":"Một nội dung của đồ án quy hoạch đô thị.","c":"Một đồ án quy hoạch xây dựng.","d":"Một nội dung của đồ án quy hoạch xây dựng."},"ans":"b","section":"chuyen_mon"},{"q":"Xác định phạm vi Đánh giá Môi trường Chiến lược (ĐMC) nhằm đảm bảo quá trình ĐMC tập trung vào những vấn đề quan trọng nhất và cung cấp được bức tranh toàn diện về môi trường, tránh thu thập và đưa ra những thông tin không cần thiết. Phạm vi ĐMC bao gồm những nội dung nào sau đây?","opts":{"a":"Xác định không gian và thời gian ĐMC; Thu thập các số liệu cơ bản cần điều tra.","b":"Xác định các chuyên gia lĩnh vực và nội dung cần ĐMC","c":"Xác định nội dung và lập kế hoạch tham vấn các bên có liên quan.","d":"Cả 3 phương án trên"},"ans":"b","section":"chuyen_mon"},{"q":"Khu cây xanh nào trong đô thị không thuộc khu chức năng cây xanh chuyên dùng?","opts":{"a":"Vườn ươm","b":"Cây xanh đường phố","c":"Cây xanh nghiên cứu","d":"Cây xanh cách ly"},"ans":"b","section":"chuyen_mon"},{"q":"Công trình nào không phải là công trình đầu mối hạ tầng kỹ thuật đô thị?","opts":{"a":"Nghĩa trang","b":"Công trình xử lý nước thải","c":"Công trình xử lý rác thải","d":"Bến bãi chứa hàng hóa"},"ans":"d","section":"chuyen_mon"},{"q":"Công trình nào thuộc khu chức năng dịch vụ đô thị?","opts":{"a":"Viện nghiên cứu","b":"Công trình tôn giáo, tín ngưỡng","c":"Công trình hành chính các cấp của đô thị","d":"Các công trình hành chính ngoài cấp quản lý hành chính của đô thị"},"ans":"c","section":"chuyen_mon"},{"q":"Công trình nào thuộc hệ thống hạ tầng xã hội đô
