ất bao nhiêu khu trung tâm?","opts":{"a":"Không nhất thiết phải có khu trung tâm","b":"1 khu trung tâm","c":"2 khu trung tâm","d":"1 khu trung tâm chính và một khu trung tâm phụ"},"ans":"b","section":"chuyen_mon"},{"q":"Hệ thống cây xanh trong điểm dân cư nông thôn là gì?","opts":{"a":"Cây xanh vườn hoa công cộng","b":"Các vườn cây tập trung (vườn cây kinh tế, cây ăn quả, cây thuốc, vườn ươm)","c":"Cây xanh cách ly","d":"Cả ba phương án trên"},"ans":"d","section":"chuyen_mon"},{"q":"Các khu chăn nuôi, sản xuất nông nghiệp và tiểu thủ công nghiệp cần được quy hoạch với cự ly bao nhiêu m?","opts":{"a":"500 m","b":"1.000 m","c":"1.500 m","d":"Đảm bảo yêu cầu về khoảng cách ly vệ sinh, đảm bảo phòng chống dịch bệnh"},"ans":"d","section":"chuyen_mon"},{"q":"Nội dung Thiết kế đô thị trong đồ án quy hoạch chung bao gồm nội dung nào sau đây?","opts":{"a":"Xác định các vùng kiến trúc cảnh quan trong đô thị.","b":"Đề xuất tổ chức không gian trong các khu trung tâm, khu vực cửa ngõ đô thị.","c":"Đề xuất trục không gian chính, quảng trường lớn, không gian cây xanh, mặt nước và điểm nhấn trong đô thị.","d":"Tất cả các nội dung trên."},"ans":"d","section":"chuyen_mon"},{"q":"Nội dung Thiết kế đô thị trong đồ án quy hoạch phân khu bao gồm việc xác định:","opts":{"a":"Chỉ tiêu khống chế về khoảng lùi.","b":"Cảnh quan đô thị dọc các trục đường chính, khu trung tâm.","c":"Các khu vực không gian mở, các công trình điểm nhấn và từng ô phố cho khu vực thiết kế.","d":"Tất cả các nội dung trên."},"ans":"d","section":"chuyen_mon"},{"q":"Nội dung Thiết kế đô thị của đồ án thiết kế đô thị riêng bao gồm?","opts":{"a":"Xác định tầng cao xây dựng cho từng công trình, khoảng lùi của công trình trên từng đường phố và ngã phố.","b":"Xác định màu sắc, vật liệu, hình thức, chi tiết kiến trúc của các công trình và các vật thể kiến trúc khác.","c":"Tổ chức cây xanh công cộng, sân vườn, cây xanh đường phố và mặt nước.","d":"Tất cả các nội dung trên."},"ans":"d","section":"chuyen_mon"},{"q":"Hệ thống cây xanh đô thị gồm có bao nhiêu nhóm chính?","opts":{"a":"2 nhóm","b":"3 nhóm","c":"4 nhóm","d":"5 nhóm"},"ans":"b","section":"chuyen_mon"},{"q":"Chỉ tiêu diện tích đất cây xanh sử dụng công cộng ngoài đơn vị ở trong các đô thị đối với đô thị loại đặc biệt là bao nhiêu?","opts":{"a":"≥ 5 m²/người","b":"≥ 6 m²/người","c":"≥ 7 m²/người","d":"≥ 8 m²/người"},"ans":"c","section":"chuyen_mon"},{"q":"Đánh giá Môi trường Chiến lược (ĐMC) là một nội dung của đồ án quy hoạch xây dựng, được thực hiện khi nào trong quá trình lập đồ án quy hoạch xây dựng?","opts":{"a":"Thực hiện trước khi lập đồ án quy hoạch xây dựng","b":"Thực hiện đồng thời trong quá trình lập đồ án quy hoạch xây dựng","c":"Thực hiện sau khi lập đồ án quy hoạch xây dựng","d":"Được thực hiện riêng biệt, độc lập với đồ án quy hoạch xây dựng"},"ans":"b","section":"chuyen_mon"},{"q":"Trong Báo cáo Đánh giá Môi trường chiến lược của các đồ án quy hoạch xây dựng, số lượng bản vẽ ít nhất kèm theo hồ sơ là bao nhiêu bản vẽ?","opts":{"a":"Ít nhất 01 bản vẽ","b":"Ít nhất 02 bản vẽ","c":"Ít nhất 03 bản vẽ","d":"Ít nhất trên 05 bản vẽ"},"ans":"b","section":"chuyen_mon"},{"q":"Việc thẩm định nội dung của Đánh giá Môi trường chiến lược (ĐMC) trong các đồ án Quy hoạch xây dựng được tiến hành khi nào?","opts":{"a":"Tiến hành trước khi thẩm định đồ án Quy hoạch xây dựng","b":"Tiến hành đồng thời với việc thẩm định đồ án quy hoạch xây dựng","c":"Sau khi thẩm định đồ án Quy hoạch xây dựng sẽ tiến hành thẩm định nội dung của ĐMC","d":"Thẩm định nội dung ĐMC riêng biệt, không liên quan đến thẩm định đồ án quy hoạch xây dựng"},"ans":"b","section":"chuyen_mon"},{"q":"Quy mô dân số đô thị tối thiểu là bao nhiêu?","opts":{"a":"Tối thiểu 4.000 người, vùng núi tối thiểu 2.800 người","b":"Tối thiểu 5.000 người, vùng núi tối thiểu 2.800 người","c":"Tối thiểu 10.000 người, vùng núi tối thiểu 3.200 người","d":"Tối thiểu 3.000 người"},"ans":"a","section":"chuyen_mon"},{"q":"Đô thị gồm các loại nào?","opts":{"a":"Thành phố, thị xã, thị trấn, thị tứ","b":"Thành phố, thị xã, thị trấn","c":"Thành phố, thị xã, thị trấn, khu đô thị","d":"Thành phố, thị xã, thị trấn, quận, phường"},"ans":"b","section":"chuyen_mon"},{"q":"Những yêu cầu nào dưới đây phù hợp với yêu cầu của quy hoạch xây dựng vùng?","opts":{"a":"Xác định được tầm nhìn, viễn cảnh phát triển của toàn vùng; Xác định được chiến lược phát triển cho các đô thị trong vùng.","b":"Xác định được tầm nhìn, viễn cảnh phát triển của toàn vùng; Xác định được mục tiêu phát triển chiến lược cho toàn vùng.","c":"Xác định được tầm nhìn, viễn cảnh không gian vùng.","d":"Xác định được viễn cảnh cho các đô thị trong vùng; Xác định được mục tiêu phát triển chiến lược cho toàn vùng."},"ans":"b","section":"chuyen_mon"},{"q":"Những yêu cầu nào dưới đây phù hợp với yêu cầu của quy hoạch chung xây dựng đô thị?","opts":{"a":"Xác định được viễn cảnh phát triển đô thị (tầm nhìn); Xác định được các chiến lược phát triển đô thị chính; Đề xuất được cấu trúc tổng thể phát triển không gian đô thị.","b":"Xác định được viễn cảnh phát triển toàn vùng; Xác định được các chiến lược phát triển đô thị chính; Đề xuất được cấu trúc tổng thể phát triển không gian đô thị.","c":"Xác định được các chiến lược phát triển cho toàn vùng; Đề xuất được cấu trúc tổng thể phát triển không gian đô thị.","d":"Xác định được cấu trúc tổ chức không gian cho từng khu vực chức năng đô thị; Đề xuất được các giải pháp chi tiết Thiết kế đô thị."},"ans":"a","section":"chuyen_mon"},{"q":"Hạ tầng kỹ thuật đô thị bao gồm các hệ thống chính nào dưới đây?","opts":{"a":"Hệ thống giao thông, hệ thống cung cấp năng lượng, hệ thống chiếu sáng công cộng, hệ thống cấp thoát nước, hệ thống quản lý các chất thải, vệ sinh môi trường, hệ thống cây xanh công viên.","b":"Công trình giao thông, thông tin liên lạc, cung cấp năng lượng, chiếu sáng công cộng, cấp nước, thu gom và xử lý nước thải, chất thải rắn, nghĩa trang và công trình khác.","c":"Hệ thống giao thông, hệ thống công trình y tế, hệ thống chiếu sáng công cộng và chiếu sáng nghệ thuật công trình, hệ thống cấp thoát nước, hệ thống quản lý các chất thải, vệ sinh môi trường, hệ thống nghĩa trang.","d":"Hệ thống giao thông, hệ thống cung cấp năng lượng, hệ thống chiếu sáng công cộng, hệ thống cấp thoát nước, hệ thống quản lý các chất thải, vệ sinh môi trường, không kể nghĩa trang."},"ans":"b","section":"chuyen_mon"},{"q":"Quy mô dân số của đơn vị ở là bao nhiêu?","opts":{"a":"Tối đa là 25.000 người, tối thiểu là 4.000 người (đô thị miền núi là 2.800 người).","b":"Tối đa là 20.000 người, tối thiểu là 4.000 người (đô thị miền núi là 2.800 người).","c":"Tối đa là 25.000 người, tối thiểu là 5.000 người (đô thị miền núi là 2.800 người).","d":"Tối đa là 20.000 người, tối thiểu là 5.000 người"},"ans":"b","section":"chuyen_mon"},{"q":"Các công trình dịch vụ công cộng cấp đơn vị ở gồm những công trình chủ yếu nào?","opts":{"a":"Nhà trẻ, mẫu giáo, trường tiểu học, trung học cơ sở, chợ, bệnh viện, trung tâm thể dục thể thao, điểm sinh hoạt văn hóa.","b":"Nhà trẻ, mẫu giáo, trường tiểu học, trung học cơ sở, chợ, bến xe, trạm y tế, nhà thi đấu, điểm sinh hoạt văn hóa.","c":"Nhà trẻ, mẫu giáo, trường tiểu học, trung học cơ sở, chợ, trạm y tế, trung tâm thể dục thể thao, điểm sinh hoạt văn hóa.","d":"Nhà trẻ, mẫu giáo, trường dạy nghề, trung học cơ sở, chợ, trạm y tế, trung tâm thể dục thể thao, điểm sinh hoạt văn hóa."},"ans":"c","section":"chuyen_mon"},{"q":"Nhóm nhà ở chung cư gồm những thành phần nào?","opts":{"a":"Diện tích chiếm đất của bản thân các khối nhà chung cư, diện tích sân đường và sân chơi nội bộ nhóm nhà ở, bãi đỗ xe nội bộ và sân vườn trong nhóm nhà ở, nhà trẻ mẫu giáo.","b":"Diện tích chiếm đất của bản thân các khối nhà chung cư, diện tích sân đường và sân chơi nội bộ nhóm nhà ở, bãi đỗ xe nội bộ và sân vườn trong nhóm nhà ở.","c":"Diện tích chiếm đất của bản thân các khối nhà chung cư, diện tích sân đường và sân chơi nội bộ nhóm nhà ở, chợ và công trình dịch vụ.","d":"Diện tích chiếm đất của bản thân các khối nhà chung cư, bãi đỗ xe nội bộ, không kể sân vườn trong nhóm nhà ở."},"ans":"b","section":"chuyen_mon"},{"q":"Nhóm nhà ở liên kế, nhà ở riêng lẻ bao gồm những thành phần nào?","opts":{"a":"Diện tích lô đất xây dựng nhà ở của các hộ gia đình (đất ở), diện tích lô đất xây dựng công trình thương mại dịch vụ trong nhóm nhà.","b":"Chỉ bao gồm diện tích lô đất xây dựng nhà ở của các hộ gia đình (đất ở).","c":"Diện tích lô đất xây dựng nhà ở của các hộ gia đình (đất ở), diện tích đường nhóm nhà ở (đường giao thông chung dẫn đến các lô đất của các hộ gia đình), không kể diện tích vườn hoa cây xanh.","d":"Diện tích lô đất xây dựng nhà ở của các hộ gia đình (đất ở), diện tích đường nhóm nhà ở (đường giao thông chung dẫn đến các lô đất của các hộ gia đình), diện tích vườn hoa, sân chơi nội bộ nhóm nhà ở."},"ans":"d","section":"chuyen_mon"},{"q":"Đất ở trong xây dựng nhà ở liên kế và nhà ở riêng lẻ là gì?","opts":{"a":"Là diện tích trong khuôn viên các lô đất ở, bao gồm diện tích chiếm đất của các công trình nhà ở liên kế và nhà ở riêng lẻ và sân vườn, đường dẫn riêng vào nhà ở liên kế hoặc nhà ở riêng lẻ đó, không bao gồm đường giao thông chung.","b":"Là diện tích trong khuôn viên các lô đất ở, bao gồm diện tích chiếm đất của các công trình nhà ở liên kế và nhà ở riêng lẻ và sân vườn, không bao gồm đường dẫn riêng vào nhà.","c":"Là diện tích trong khuôn viên các lô đất ở, không bao gồm đường giao thông.","d":"Là diện tích trong khuôn viên các lô đất ở, bao gồm diện tích chiếm đất của các công trình nhà ở liên kế và nhà ở riêng lẻ và sân vườn, đường dẫn riêng vào nhà ở và đường giao thông chung xung quanh"},"ans":"a","section":"chuyen_mon"},{"q":"Những yêu cầu nào dưới đây phù hợp với yêu cầu của quy hoạch chi tiết xây dựng đô thị tỷ lệ 1/500?","opts":{"a":"Đề xuất được các giải pháp tổ chức không gian quy hoạch kiến trúc cảnh quan trên mặt đất và không gian xây dựng ngầm;","b":"Đề xuất được các giải pháp thiết kế sơ bộ công trình, cảnh quan trên mặt đất và không gian xây dựng ngầm;","c":"Đề xuất được cấu trúc tổng thể phát triển không gian đô thị trên mặt đất và không gian xây dựng ngầm;","d":"Đề xuất được cấu trúc tổ chức không gian toàn đô thị."},"ans":"a","section":"chuyen_mon"},{"q":"Những nội dung về quy hoạch sử dụng đất trong quy hoạch chi tiết xây dựng đô thị tỷ lệ 1/500 là:","opts":{"a":"Xác định diện tích và chiều cao, hình thức kiến trúc công trình cho từng lô đất.","b":"Xác định diện tích, mật độ xây dựng và chiều cao công trình cho từng lô đất, xác định quy mô các công trình ngầm","c":"Xác định diện tích đất, hệ số sử dụng đất trên từng lô đất, xác định quy mô các công trình ngầm","d":"Xác định diện tích, chiều cao, hình thái công trình cho từng lô đất"},"ans":"b","section":"chuyen_mon"},{"q":"Đất được lựa chọn để xây dựng đô thị phải đáp ứng những yêu cầu điều kiện tự nhiên nào dưới đây?","opts":{"a":"Có điều kiện tự nhiên có thể xây dựng công trình cao tầng từ 30 tầng trở lên; có khả năng khắc phục, không chế hiện tượng sụt lở, các-tơ, chấn động…","b":"Có điều kiện tự nhiên (địa hình, địa chất, thủy văn, khí hậu) thuận lợi để xây dựng công trình sản xuất; không nằm trong khu vực đất có các hiện tượng mưa lớn gây ngập lụt hoặc hệ sinh thái nghèo nàn.","c":"Có điều kiện tự nhiên (địa hình, địa chất, thủy văn, khí hậu) có thể xây dựng công trình; không nằm trong khu vực dễ hỏa hoạn, cháy nổ.","d":"Có điều kiện tự nhiên (địa hình, địa chất, thủy văn, khí hậu) có thể xây dựng công trình; không nằm trong khu vực đất có các hiện tượng gây sụt lở, các-tơ, trôi trượt, xói mòn, chấn động…"},"ans":"d","section":"chuyen_mon"},{"q":"Các công trình dịch vụ đô thị như nhà trẻ, trường học, bệnh viện cần được bố trí như thế nào?","opts":{"a":"Các công trình nhà trẻ, trường học, bệnh viện… phải bố trí tiếp giáp đường giao thông chính cấp đô thị trở lên, đảm bảo có đủ diện tích sân vườn, cây xanh và chỗ đỗ xe.","b":"Các công trình nhà trẻ, trường học, bệnh viện… chỉ được bố trí tiếp giáp các trục đường trong nhóm nhà, đảm bảo có đủ diện tích sân vườn, cây xanh và chỗ đỗ xe.","c":"Các công trình nhà trẻ, trường học, bệnh viện… không bố trí tiếp giáp các trục đường cấp đô thị trở lên, đảm bảo có đủ diện tích sân vườn, cây xanh và chỗ đỗ xe.","d":"Các công trình nhà trẻ, trường học, bệnh viện… có thể bố trí tiếp giáp các trục đường cấp đô thị trở lên với điều kiện đảm bảo có đủ diện tích sân vườn, cây xanh và chỗ đỗ xe."},"ans":"c","section":"chuyen_mon"},{"q":"Chỉ tiêu diện tích đất cho các công trình trường tiểu học trong đơn vị ở tối thiểu như thế nào?","opts":{"a":"Chỉ tiêu sử dụng công trình tối thiểu là 50 chỗ/1.000 người. Chỉ tiêu sử dụng đất tối thiểu là 15 m²/1 chỗ.","b":"Chỉ tiêu sử dụng công trình tối thiểu là 80 chỗ/1.000 người. Chỉ tiêu sử dụng đất tùy theo chiều cao công trình","c":"Chỉ tiêu sử dụng công trình tối thiểu là 50 chỗ/1.000 người. Chỉ tiêu sử dụng đất tùy theo phương án thiết kế công trình.","d":"Chỉ tiêu sử dụng công trình tối thiểu là 50 chỗ/1.000 người. Chỉ tiêu sử dụng đất tối thiểu là 5.000 m²/trường."},"ans":"a","section":"chuyen_mon"},{"q":"Mật độ xây dựng gộp (brut-tô) tối đa cho phép của đơn vị ở là bao nhiêu?","opts":{"a":"20%","b":"60%","c":"90%","d":"80%"},"ans":"b","section":"chuyen_mon"},{"q":"Mật độ xây dựng gộp (brut-tô) tối đa của khu công viên công cộng là bao nhiêu?","opts":{"a":"5%","b":"2%","c":"15%","d":"25%"},"ans":"a","section":"chuyen_mon"},{"q":"Quy định về sử dụng đất đối với các công trình giáo dục trong Quy hoạch cải tạo các khu vực cũ trong đô thị?","opts":{"a":"Trừ các công trình giáo dục phải đảm bảo chuẩn quốc gia do Bộ giáo dục và Đào tạo quy định, chỉ tiêu sử dụng đất các loại công trình khác trong các khu vực quy hoạch cải tạo được giảm và tối thiểu đạt 20% so với các chỉ tiêu sử dụng đất tương ứng trong các khu vực xây dựng mới.","b":"Chỉ tiêu sử dụng đất các loại công trình trong các khu vực quy hoạch cải tạo giữ nguyên so với các chỉ tiêu sử dụng đất tương ứng trong các khu vực xây dựng mới.","c":"Trừ các công trình giáo dục phải đảm bảo chuẩn quốc gia do Bộ giáo dục và Đào tạo quy định, chỉ tiêu sử dụng đất các loại công trình khác trong các khu vực quy hoạch cải tạo được giảm và tối thiểu đạt 50% so với các chỉ tiêu sử dụng đất tương ứng trong các khu vực xây dựng mới.","d":"Chỉ tiêu công trình giáo dục trong các khu vực quy hoạch cải tạo do Bộ giáo dục và Đào tạo quy định theo mức chuẩn quốc gia."},"ans":"c","section":"chuyen_mon"},{"q":"Trong nội dung Thiết kế đô thị của đồ án quy hoạch chi tiết 1/500 cần đáp ứng yêu cầu về quản lý kiến trúc đô thị?","opts":{"a":"Có đầy đủ nội dung để quản lý kiến trúc cảnh quan của từng công trình, từng ô phố, từng tuyến phố và khu vực.","b":"Có đầy đủ nội dung để quản lý kiến trúc cảnh quan tổng thể đô thị","c":"Có đầy đủ nội dung để quản lý hạ tầng kỹ thuật, môi trường sinh thái của đô thị và từng công trình, từng ô phố, từng tuyến phố và khu vực.","d":"Có đầy đủ nội dung để quản lý kiến trúc cảnh quan của một số công trình."},"ans":"a","section":"chuyen_mon"},{"q":"Trong quy hoạch nông thôn, việc phát triển đất để mở rộng các điểm dân cư nông thôn phải tuân thủ quy định nào?","opts":{"a":"Hạn chế sử dụng đất canh tác, cần tận dụng đất đồi, núi, gò, bãi, đất có năng suất trồng trọt kém để xây dựng và mở rộng các điểm dân cư.","b":"Không được sử dụng đất canh tác, đặc biệt là đất canh tác nông nghiệp năng suất cao để xây dựng và mở rộng các điểm dân cư.","c":"Chỉ được sử dụng đất đồi, núi, gò, bãi, đất có năng suất trồng trọt kém để xây dựng và mở rộng các điểm dân cư.","d":"Hạn chế mở rộng các điểm dân cư, chỉ tập trung cải tạo trên cơ sở quỹ đất hiện có."},"ans":"a","section":"chuyen_mon"},{"q":"Những công trình dịch vụ đô thị nào dưới đây không thuộc cấp quản lý đơn vị ở?","opts":{"a":"Trường tiểu học.","b":"Bệnh viện đa khoa","c":"Trường mẫu giáo","d":"Trạm y tế"},"ans":"b","section":"chuyen_mon"},{"q":"Đường giao thông chính của đô thị có được xuyên cắt qua đơn vị ở không?","opts":{"a":"Không","b":"Có","c":"Có thể, tùy trường hợp","d":"Được xuyên qua nếu hạn chế tốc độ"},"ans":"a","section":"chuyen_mon"},{"q":"Bán kính phục vụ của công trình dịch vụ cấp I và vườn hoa sân chơi trong đơn vị ở là bao nhiêu?","opts":{"a":"≤ 500 m","b":"≤ 300 m","c":"≤ 1.000 m","d":"Không yêu cầu cụ thể"},"ans":"a","section":"chuyen_mon"},{"q":"Chỉ giới xây dựng là gì?","opts":{"a":"Là đường giới hạn cho phép xây dựng nhà, công trình trên lô đất","b":"Là đường giới hạn cho phép xây dựng tường rào của lô đất","c":"Là đường giới hạn cho phép xây dựng nhà, công trình, công trình kỹ thuật ngầm.","d":"Là đường giới hạn cho phép xây dựng nhà, trồng cây xanh, tường rào"},"ans":"a","section":"chuyen_mon"},{"q":"Đất ở trong lô đất xây dựng nhà chung cư là gì?","opts":{"a":"Là diện tích chiếm đất của các công trình nhà ở chung cư.","b":"Là diện tích chiếm đất của các công trình nhà ở chung cư và sân vườn trên lô đất","c":"Là diện tích chiếm đất của các công trình nhà ở chung cư và đường giao thông xung quanh","d":"Là diện tích chiếm đất của các công trình nhà ở chung cư và sân vườn, đường giao thông, công trình kỹ thuật trên lô đất"},"ans":"a","section":"chuyen_mon"},{"q":"Chỉ giới đường đỏ là gì?","opts":{"a":"Là đường ranh giới phân định giữa phần lô đất để xây dựng công trình và phần đất còn lại.","b":"Là đường ranh giới phân định giữa phần lô đất để xây dựng công trình và phần đất dành cho đường giao thông hoặc các công trình hạ tầng kỹ thuật.","c":"Là đường ranh giới phân định phạm vi để xây dựng công trình và phần đất dành cho đường giao thông hoặc các công trình hạ tầng kỹ thuật.","d":"Là đường ranh giới phân định phạm vi sử dụng đất của công trình giao thông và công trình khác."},"ans":"b","section":"chuyen_mon"},{"q":"Các công trình dịch vụ đô thị phục vụ trong đơn vị ở (trường học, chợ…) cần đảm bảo bán kính phục vụ là bao nhiêu?","opts":{"a":"Không quá 700 m. Riêng với khu vực có địa hình phức tạp, bán kính phục vụ không quá 1 km.","b":"Không quá 500 m. Riêng với khu vực có địa hình phức tạp, bán kính phục vụ không quá 1 km.","c":"Không quá 300 m. Riêng với khu vực có địa hình phức tạp, bán kính phục vụ không quá 500 m.","d":"Không quá 300 m."},"ans":"b","section":"chuyen_mon"},{"q":"Chỉ tiêu sử dụng đất ở (các lô đất ở gia đình) cho các điểm dân cư nông thôn?","opts":{"a":"Phải phù hợp với điều kiện cụ thể của địa phương và ≥ 50 m²/người.","b":"Phải phù hợp với điều kiện cụ thể của địa phương và ≥ 25 m²/người.","c":"Phải phù hợp với điều kiện cụ thể của địa phương.","d":"Phải phù hợp với điều kiện cụ thể của địa phương và ≥ 10 m²/người."},"ans":"b","section":"chuyen_mon"},{"q":"Khoảng lùi tối thiểu giữa chỉ giới đường đỏ và chỉ giới xây dựng đối với công trình có chiều cao nhỏ hơn hoặc bằng 16 m là bao nhiêu?","opts":{"a":"0 m","b":"6 m","c":"Từ 0 đến 6 m tùy thuộc chiều rộng lộ giới","d":"3 m"},"ans":"a","section":"chuyen_mon"},{"q":"Chỉ tiêu đất đơn vị ở bình quân toàn đô thị áp dụng cho đô thị loại I-II là bao nhiêu?","opts":{"a":"10 – 25 m²/người","b":"15 - 28 m²/người","c":"28 – 45 m²/người","d":"45 – 55 m²/người"},"ans":"b","section":"chuyen_mon"},{"q":"Chỉ tiêu đất đơn vị ở bình quân toàn đô thị áp dụng cho đô thị loại III-IV là bao nhiêu?","opts":{"a":"10 – 25 m²/người","b":"15 - 28 m²/người","c":"28 – 45 m²/người","d":"45 – 55 m²/người"},"ans":"c","section":"chuyen_mon"},{"q":"Chỉ tiêu đất đơn vị ở bình quân toàn đô thị áp dụng cho đô thị loại V là bao nhiêu?","opts":{"a":"15 - 28 m²/người","b":"28 – 45 m²/người","c":"45 – 55 m²/người","d":"55 – 65 m²/người"},"ans":"c","section":"chuyen_mon"},{"q":"Chỉ tiêu đất cây xanh trong đơn vị ở tối thiểu là bao nhiêu?","opts":{"a":"1,5 m²/người","b":"2,0 m²/người","c":"2,5 m²/người","d":"3,0 m²/người"},"ans":"b","section":"chuyen_mon"},{"q":"Đối với các dự án có dân số dưới 4.000 người, chỉ tiêu đất cây xanh tối thiểu là bao nhiêu?","opts":{"a":"0,5 m²/người","b":"0,8 m²/người","c":"1,0 m²/người","d":"1,2 m²/người"},"ans":"c","section":"chuyen_mon"},{"q":"Công trình dịch vụ - công cộng nào không thuộc cấp phục vụ của đơn vị ở?","opts":{"a":"Sân luyện tập","b":"Sân thể const TOTAL_TIME = 30 * 60; // 30 phút
const PL_COUNT = 10;
const CM_COUNT = 20;
const PASS_PL = 7;
const PASS_TOTAL = 21;
const MAX_PL = 10;
const MAX_CM = 20;

let state = {
  screen: 'welcome', // welcome | exam | result | review
  questions: [],
  answers: {}, // idx -> chosen key
  current: 0,
  timeLeft: TOTAL_TIME,
  timerInterval: null,
  reviewFilter: 'all',
  submitted: false
};

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pick(arr, n){ return shuffle(arr).slice(0, n); }

function buildExam(){
  const pl = pick(PL_POOL, PL_COUNT).map(q=>({...q, _section:'pl'}));
  const cm = pick(CM_POOL, CM_COUNT).map(q=>({...q, _section:'cm'}));
  return shuffle([...pl, ...cm]);
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function calcScore(){
  let pl=0, cm=0;
  state.questions.forEach((q,i)=>{
    const ans = state.answers[i];
    if(!ans) return;
    if(ans === q.ans){
      if(q._section==='pl') pl++;
      else cm++;
    }
  });
  return {pl, cm, total: pl+cm};
}

function startTimer(){
  stopTimer();
  updateTimerBar();
  state.timerInterval = setInterval(()=>{
    state.timeLeft--;
    updateTimerBar();
    updateTimerDisplay();
    if(state.timeLeft <= 0){
      stopTimer();
      submitExam(true);
    }
  }, 1000);
}

function stopTimer(){
  if(state.timerInterval) clearInterval(state.timerInterval);
}

function updateTimerBar(){
  const fill = document.getElementById('timerFill');
  if(!fill) return;
  const pct = (state.timeLeft / TOTAL_TIME) * 100;
  fill.style.width = pct + '%';
  fill.className = 'timer-fill' + (pct < 20 ? ' danger' : pct < 40 ? ' warning' : '');
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const pct = state.timeLeft / TOTAL_TIME;
  el.textContent = '⏱ ' + formatTime(state.timeLeft);
  el.className = 'timer-display' + (pct < 0.2 ? ' danger' : pct < 0.4 ? ' warning' : '');
}

function updateScorePreview(){
  const {pl,cm} = calcScore();
  const elPl = document.getElementById('scorePl');
  const elCm = document.getElementById('scoreCm');
  if(elPl) elPl.textContent = pl + '/' + MAX_PL;
  if(elCm) elCm.textContent = cm + '/' + MAX_CM;
}

function submitExam(autoSubmit=false){
  state.submitted = true;
  stopTimer();
  state.screen = 'result';
  render();
}

// ── Render ──

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'welcome') app.innerHTML = renderWelcome();
  else if(state.screen === 'exam') app.innerHTML = renderExam();
  else if(state.screen === 'result') app.innerHTML = renderResult();
  else if(state.screen === 'review') app.innerHTML = renderReview();
  bindEvents();
}

function renderWelcome(){

  <div class="welcome">

    <p class="welcome-desc">Bộ câu hỏi sát hạch kiến thức pháp luật và chuyên môn nghề nghiệp theo quy định</p>

      <div class="info-card">
        <div class="info-card-label">Thời gian</div>
        <div class="info-card-value">30</div>
        <div class="info-card-sub">Phút</div>
      </div>
      <div class="info-card">
        <div class="info-card-label">Số câu hỏi</div>
        <div class="info-card-value">30</div>
        <div class="info-card-sub">Câu hỏi được trộn ngẫu nhiên</div>
      </div>
      <div class="info-card">
        <div class="info-card-label">Pháp luật</div>
        <div class="info-card-value">10</div>
        <div class="info-card-sub">Điểm tối đa</div>
      </div>
      <div class="info-card">
        <div class="info-card-label">Chuyên môn</div>
        <div class="info-card-value">20</div>
        <div class="info-card-sub">Điểm tối đa</div>
      </div>
    </div>
    <div class="pass-box">
      <strong>Điều kiện đạt:</strong> Điểm pháp luật <strong>≥ 7/10</strong> và Tổng điểm <strong>≥ 21/30</strong>
    </div>
    <button class="btn-start" onclick="startExam()">Bắt Đầu Sát Hạch →</button>
  </div>`;
}

function renderExam(){
  const q = state.questions[state.current];
  const answered = state.answers[state.current];
  const isLast = state.current === state.questions.length - 1;
  const isFirst = state.current === 0;
  const total = state.questions.length;
  const answeredCount = Object.keys(state.answers).length;
  const pct = ((state.current + 1) / total * 100).toFixed(1);
  const {pl, cm} = calcScore();

  const dots = state.questions.map((qq, i) => {
    let cls = 'dot';
    if(i === state.current) cls += ' current';
    else if(state.answers[i] !== undefined){
      if(state.answers[i] === qq.ans) cls += ' answered-correct';
      else cls += ' answered-wrong';
    }
    return `<div class="${cls}" onclick="goToQuestion(${i})">${i+1}</div>`;
  }).join('');

  let optsHtml = '';
  ['a','b','c','d'].forEach(key => {
    if(!q.opts[key]) return;
    let cls = 'opt-btn';
    if(answered){
      if(key === q.ans) cls += ' correct';
      else if(key === answered) cls += ' wrong';
    } else if(key === state.answers[state.current]){
      cls += ' selected';
    }
    optsHtml += `
      <button class="${cls}" onclick="selectAnswer('${key}')" ${answered ? 'disabled' : ''}>
        <span class="opt-key">${key.toUpperCase()}</span>
        <span class="opt-text">${q.opts[key]}</span>
      </button>`;
  });

  let feedbackHtml = '';
  if(answered){
    const ok = answered === q.ans;
    feedbackHtml = `<div class="feedback ${ok ? 'ok' : 'err'}">${ok ? '✓ Chính xác!' : `✗ Đáp án đúng là <strong>${q.ans.toUpperCase()}</strong>`}</div>`;
  }

  const sectionTag = q._section === 'pl'
    ? `<span class="section-tag pl">Pháp luật</span>`
    : `<span class="section-tag cm">Chuyên môn</span>`;

  return `
  <div class="exam-topbar">
    <div class="progress-text">Câu <span>${state.current+1}</span> / <span>${total}</span> &nbsp;·&nbsp; Đã làm: <span>${answeredCount}</span></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="score-preview">
        <div class="score-chip pl">PL <span id="scorePl">${pl}/${MAX_PL}</span></div>
        <div class="score-chip cm">CM <span id="scoreCm">${cm}/${MAX_CM}</span></div>
      </div>
      <div class="timer-display" id="timerDisplay">⏱ ${formatTime(state.timeLeft)}</div>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="q-card">
    ${sectionTag}
    <div class="q-number">CÂU ${state.current+1}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">${optsHtml}</div>
    ${feedbackHtml}
  </div>
  <div class="nav-area">
    <button class="btn-nav" onclick="prevQuestion()" ${isFirst ? 'disabled' : ''}>← Trước</button>
    <button class="btn-nav" onclick="jumpNextUnanswered()">Câu chưa làm ↓</button>
    ${isLast
      ? `<button class="btn-nav primary" onclick="confirmSubmit()">Nộp bài →</button>`
      : `<button class="btn-nav primary" onclick="nextQuestion()">Tiếp →</button>`
    }
  </div>
  <div class="dot-nav">${dots}</div>`;
}

function renderResult(){
  const {pl, cm, total} = calcScore();
  const plPass = pl >= PASS_PL;
  const totalPass = total >= PASS_TOTAL;
  const pass = plPass && totalPass;
  const unanswered = state.questions.length - Object.keys(state.answers).length;

  return `
  <div class="result">
    <div class="result-badge ${pass ? 'pass' : 'fail'}">${pass ? '🎉' : '📋'}</div>
    <h2 class="${pass ? 'pass' : 'fail'}">${pass ? 'ĐẠT YÊU CẦU' : 'CHƯA ĐẠT'}</h2>
    <p class="result-verdict">${unanswered > 0 ? `Còn ${unanswered} câu chưa trả lời.` : 'Đã hoàn thành tất cả câu hỏi.'}</p>

    <div class="score-breakdown">
      <div class="sc-box total">
        <div class="sc-val">${total} / 30</div>
        <div class="sc-label">Tổng điểm</div>
      </div>
      <div class="sc-box pl">
        <div class="sc-val">${pl} / 10</div>
        <div class="sc-label">Pháp luật</div>
      </div>
      <div class="sc-box cm">
        <div class="sc-val">${cm} / 20</div>
        <div class="sc-label">Chuyên môn</div>
      </div>
    </div>

    <div class="conditions">
      <div class="cond-row">
        <span class="cond-icon">${plPass ? '✅' : '❌'}</span>
        <span class="cond-text">Điểm pháp luật <strong>${pl}/10</strong> (yêu cầu ≥ 7)</span>
        <span class="cond-result ${plPass ? 'ok' : 'fail'}">${plPass ? 'ĐẠT' : 'CHƯA ĐẠT'}</span>
      </div>
      <div class="cond-row">
        <span class="cond-icon">${totalPass ? '✅' : '❌'}</span>
        <span class="cond-text">Tổng điểm <strong>${total}/30</strong> (yêu cầu ≥ 21)</span>
        <span class="cond-result ${totalPass ? 'ok' : 'fail'}">${totalPass ? 'ĐẠT' : 'CHƯA ĐẠT'}</span>
      </div>
    </div>

    <button class="btn-retry" onclick="startExam()">Làm lại</button>
    <button class="btn-review" onclick="openReview()">Xem đáp án</button>
  </div>`;
}

function renderReview(){
  const filter = state.reviewFilter;
  let items = state.questions.map((q, i) => {
    const ans = state.answers[i];
    const correct = ans === q.ans;
    return { q, i, ans, correct };
  });

  if(filter === 'wrong') items = items.filter(x => x.ans && !x.correct);
  else if(filter === 'correct') items = items.filter(x => x.correct);
  else if(filter === 'unanswered') items = items.filter(x => !x.ans);

  const cards = items.map(({q, i, ans, correct}) => {
    let borderCls = ans ? (correct ? 'correct-border' : 'wrong-border') : '';
    const opts = ['a','b','c','d'].filter(k => q.opts[k]).map(key => {
      let cls = 'rev-opt';
      if(key === q.ans) cls += ' correct';
      else if(key === ans && !correct) cls += ' user-wrong';
      return `<div class="${cls}"><span class="rev-opt-key">${key.toUpperCase()}.</span><span>${q.opts[key]}</span></div>`;
    }).join('');

    const tag = q._section === 'pl'
      ? `<span class="section-tag pl" style="font-size:10px;padding:2px 8px;margin-right:6px">Pháp luật</span>`
      : `<span class="section-tag cm" style="font-size:10px;padding:2px 8px;margin-right:6px">Chuyên môn</span>`;

    const status = !ans ? '⬜ Bỏ qua' : (correct ? '✅ Đúng' : '❌ Sai');
    return `
    <div class="review-card ${borderCls}">
      <div style="display:flex;align-items:center;margin-bottom:8px;font-size:12px;color:var(--text-muted)">
        ${tag}Câu ${i+1} &nbsp;·&nbsp; ${status}
        ${!ans ? '' : (correct ? '' : `&nbsp;·&nbsp; Bạn chọn: <strong style="color:var(--red)">${ans.toUpperCase()}</strong>`)}
      </div>
      <div class="review-q">${q.q}</div>
      <div class="review-opts">${opts}</div>
    </div>`;
  }).join('');

  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const correct = state.questions.filter((q,i) => state.answers[i] === q.ans).length;
  const wrong = answered - correct;

  return `
  <div class="review-header">
    <div class="review-title">Xem lại đáp án</div>
    <button class="btn-nav" onclick="openResult()">← Kết quả</button>
  </div>
  <div class="review-filter" style="margin-bottom:16px">
    <button class="filter-btn ${filter==='all'?'active':''}" onclick="setFilter('all')">Tất cả (${total})</button>
    <button class="filter-btn ${filter==='correct'?'active':''}" onclick="setFilter('correct')">Đúng (${correct})</button>
    <button class="filter-btn ${filter==='wrong'?'active':''}" onclick="setFilter('wrong')">Sai (${wrong})</button>
    <button class="filter-btn ${filter==='unanswered'?'active':''}" onclick="setFilter('unanswered')">Bỏ qua (${total-answered})</button>
  </div>
  ${items.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:40px">Không có câu hỏi nào.</p>' : cards}`;
}

// ── Events ──

function bindEvents(){}

function startExam(){
  state.questions = buildExam();
  state.answers = {};
  state.current = 0;
  state.timeLeft = TOTAL_TIME;
  state.submitted = false;
  state.screen = 'exam';
  render();
  startTimer();
}

function selectAnswer(key){
  if(state.answers[state.current] !== undefined) return;
  state.answers[state.current] = key;
  render();
  updateTimerDisplay();
}

function nextQuestion(){
  if(state.current < state.questions.length - 1){
    state.current++;
    render();
  }
}

function prevQuestion(){
  if(state.current > 0){
    state.current--;
    render();
  }
}

function goToQuestion(i){
  state.current = i;
  render();
}

function jumpNextUnanswered(){
  for(let i = state.current + 1; i < state.questions.length; i++){
    if(state.answers[i] === undefined){ state.current = i; render(); return; }
  }
  for(let i = 0; i < state.current; i++){
    if(state.answers[i] === undefined){ state.current = i; render(); return; }
  }
  // all answered
  alert('Đã trả lời tất cả câu hỏi!');
}

function confirmSubmit(){
  const unanswered = state.questions.length - Object.keys(state.answers).length;
  if(unanswered > 0){
    if(!confirm(`Còn ${unanswered} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài?`)) return;
  }
  submitExam();
}

function openReview(){
  state.screen = 'review';
  state.reviewFilter = 'all';
  render();
}

function openResult(){
  state.screen = 'result';
  render();
}

function setFilter(f){
  state.reviewFilter = f;
  render();
}

// Init
render();
</script>
</body>
</html>
