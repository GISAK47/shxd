<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sát Hạch – Thiết Kế Quy Hoạch Xây Dựng Hạng III</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#2a3244;
  --gold:#c9a84c;--gold-light:#e8c96a;--text:#e6eaf0;--text-muted:#8b95a7;
  --green:#3fb950;--red:#f85149;--blue:#58a6ff;--radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',sans-serif;font-size:15px;min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,168,76,.08),transparent),
  radial-gradient(ellipse 60% 40% at 80% 90%,rgba(88,166,255,.04),transparent);}
.timer-bar{height:3px;background:var(--border);position:fixed;top:0;left:0;right:0;z-index:200;}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width 1s linear,background 1s;}
.timer-fill.warning{background:linear-gradient(90deg,#e3a520,#f0c040)}
.timer-fill.danger{background:linear-gradient(90deg,var(--red),#ff7b72)}
.header{border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;
  background:rgba(22,27,34,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
.header-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.header-title{font-family:'Playfair Display',serif;font-size:16px;line-height:1.2}
.header-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.container{max-width:780px;margin:0 auto;padding:24px 20px 60px}

.loading{text-align:center;padding:80px 20px;}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text-muted);font-size:14px}

.welcome{text-align:center;padding:50px 20px 40px}
.welcome-badge{display:inline-block;background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));
  border:1px solid rgba(201,168,76,.3);border-radius:100px;padding:6px 18px;font-size:12px;
  color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;}
.welcome h1{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,34px);line-height:1.2;margin-bottom:8px;
  background:linear-gradient(135deg,var(--text),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.welcome-desc{color:var(--text-muted);font-size:14px;max-width:480px;margin:0 auto 30px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px;text-align:left;}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.info-card-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.info-card-value{font-size:20px;font-weight:700;color:var(--gold)}
.info-card-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.pass-box{background:linear-gradient(135deg,rgba(63,185,80,.08),rgba(63,185,80,.03));
  border:1px solid rgba(63,185,80,.2);border-radius:var(--radius);padding:14px 18px;margin-bottom:24px;text-align:left;font-size:13px;}
.pass-box strong{color:var(--green)}

.form-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;text-align:left;}
.form-section h3{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--text)}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.form-row input{width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:11px 14px;font-size:14px;
  font-family:'Be Vietnam Pro',sans-serif;outline:none;transition:border-color .15s;}
.form-row input:focus{border-color:var(--gold)}
.form-row input::placeholder{color:var(--text-muted)}
.error-msg{font-size:12px;color:var(--red);margin-top:6px;display:none}

.btn-start{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0d1117;font-weight:700;
  font-size:15px;border:none;border-radius:var(--radius);padding:14px 48px;cursor:pointer;
  font-family:'Be Vietnam Pro',sans-serif;letter-spacing:.3px;transition:opacity .2s,transform .15s;
  box-shadow:0 4px 24px rgba(201,168,76,.3);width:100%;}
.btn-start:hover{opacity:.9;transform:translateY(-1px)}
.btn-start:disabled{opacity:.5;cursor:not-allowed;transform:none}

.exam-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.progress-text{font-size:13px;color:var(--text-muted)}
.progress-text span{color:var(--text);font-weight:600}
.timer-display{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:8px 14px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;}
.timer-display.warning{border-color:rgba(227,165,32,.4);color:#e3a520}
.timer-display.danger{border-color:rgba(248,81,73,.4);color:var(--red)}
.score-chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;}
.score-chip span{font-weight:700;margin-left:4px}
.score-chip.pl span{color:var(--blue)}.score-chip.cm span{color:var(--gold)}
.progress-bar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:22px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:2px;transition:width .4s ease}
.section-tag{display:inline-block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 10px;border-radius:4px;margin-bottom:12px;font-weight:600;}
.section-tag.pl{background:rgba(88,166,255,.12);color:var(--blue);border:1px solid rgba(88,166,255,.2)}
.section-tag.cm{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.2)}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;
  margin-bottom:16px;animation:fadeSlide .3s ease;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-number{font-size:11px;color:var(--text-muted);margin-bottom:10px;font-weight:600;letter-spacing:.5px}
.q-text{font-size:15px;line-height:1.65;color:var(--text);margin-bottom:20px;font-weight:500}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:flex-start;gap:12px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;
  transition:border-color .15s,background .15s;color:var(--text);font-size:14px;
  line-height:1.5;font-family:'Be Vietnam Pro',sans-serif;width:100%;}
.opt-btn:hover:not(:disabled){border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.06)}
.opt-key{width:22px;height:22px;flex-shrink:0;background:var(--border);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  margin-top:1px;transition:background .15s,color .15s;color:var(--text-muted);}
.opt-btn.selected{border-color:rgba(201,168,76,.6);background:rgba(201,168,76,.1)}
.opt-btn.selected .opt-key{background:var(--gold);color:#0d1117}
.opt-btn:disabled{cursor:default;opacity:.85}
.nav-area{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.btn-nav{background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:'Be Vietnam Pro',sans-serif;font-size:13px;font-weight:600;
  border-radius:8px;padding:10px 20px;cursor:pointer;transition:border-color .15s,background .15s;}
.btn-nav:hover{border-color:var(--gold);background:rgba(201,168,76,.05)}
.btn-nav.primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0d1117;border-color:transparent;
  box-shadow:0 2px 12px rgba(201,168,76,.25);}
.btn-nav.primary:hover{opacity:.9}
.btn-nav:disabled{opacity:.35;cursor:not-allowed}
.dot-nav{display:flex;flex-wrap:wrap;gap:5px;padding:16px 0;justify-content:center;}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--text-muted);}
.dot:hover{border-color:var(--gold);color:var(--gold)}
.dot.current{border-color:var(--gold);background:rgba(201,168,76,.15);color:var(--gold)}
.dot.answered{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.4);color:var(--gold-light)}

.submitting{text-align:center;padding:80px 20px}
.submitting p{color:var(--text-muted);font-size:14px;margin-top:16px}

.result{text-align:center;padding:36px 10px}
.result-badge{width:96px;height:96px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;border:3px solid;}
.result-badge.pass{border-color:var(--green);background:rgba(63,185,80,.1);box-shadow:0 0 40px rgba(63,185,80,.15)}
.result-badge.fail{border-color:var(--red);background:rgba(248,81,73,.08);box-shadow:0 0 40px rgba(248,81,73,.12)}
.result h2{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.result h2.pass{color:var(--green)}.result h2.fail{color:var(--red)}
.result-verdict{font-size:13px;color:var(--text-muted);margin-bottom:26px}
.score-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sc-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 12px}
.sc-box .sc-val{font-size:28px;font-weight:700;font-family:'Playfair Display',serif}
.sc-box .sc-label{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4}
.sc-box.total .sc-val{color:var(--gold)}.sc-box.pl .sc-val{color:var(--blue)}.sc-box.cm .sc-val{color:var(--gold-light)}
.conditions{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;text-align:left}
.cond-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px}
.cond-icon{font-size:18px;width:26px;text-align:center}.cond-text{flex:1}
.cond-result{font-weight:700;font-size:13px}
.cond-result.ok{color:var(--green)}.cond-result.fail{color:var(--red)}
.btn-retry{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;
  padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
  margin-right:10px;transition:border-color .15s;}
.btn-retry:hover{border-color:var(--gold)}

.error-screen{text-align:center;padding:60px 20px}
.error-screen .err-icon{font-size:48px;margin-bottom:16px}
.error-screen h3{font-size:18px;margin-bottom:8px;color:var(--red)}
.error-screen p{font-size:13px;color:var(--text-muted);margin-bottom:20px;max-width:400px;margin-left:auto;margin-right:auto}
.config-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;
  text-align:left;font-size:12px;margin-bottom:20px}
.config-box code{color:var(--gold);font-family:monospace;font-size:12px}

::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:520px){.score-breakdown{grid-template-columns:1fr 1fr}.sc-box.total{grid-column:span 2}}
</style>
</head>
<body>
<div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
<header class="header">
  <div class="header-icon">🏛</div>
  <div>
    <div class="header-title">Sát Hạch Chứng Chỉ Hành Nghề</div>
    <div class="header-sub">Thiết Kế Quy Hoạch Xây Dựng – Hạng III by NNK</div>
  </div>
</header>
<div class="container" id="app"></div>

<script>
// ✅ ĐÃ CẬP NHẬT URL ĐÚNG (exec URL, không phải echo URL)
const API_URL = "https://script.google.com/macros/s/AKfycbz4-wU1_m0xWmTVf4Co4AC3SYaLQ3ZISmqcXrEJwgBrDJsjtMkr1N-eJxUMJH6TiVtS/exec";

const TOTAL_TIME = 30 * 60;
const PASS_PL    = 7;
const PASS_TOTAL = 21;
const MAX_PL     = 10;
const MAX_CM     = 20;

let state = {
  screen:    "welcome",
  questions: [],
  answers:   {},
  current:   0,
  timeLeft:  TOTAL_TIME,
  timerInt:  null,
  result:    null,
  userName:  "",
  userEmail: "",
  startTime: null
};

// ──────────────────────────────────────────────────
//  API calls
//  FIX CORS: Dùng Content-Type: text/plain để tránh preflight OPTIONS
//  Apps Script không hỗ trợ CORS preflight với application/json
// ──────────────────────────────────────────────────
async function fetchQuestions() {
  const res = await fetch(API_URL + "?action=getQuestions", {
    redirect: "follow"
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (!data.questions) throw new Error("Không có câu hỏi");
  return data.questions;
}

async function submitToAPI(payload) {
  // ✅ FIX: Dùng text/plain thay vì application/json
  //    Tránh CORS preflight request mà Apps Script không xử lý được
  const res = await fetch(API_URL, {
    method:   "POST",
    redirect: "follow",
    headers:  { "Content-Type": "text/plain;charset=utf-8" },
    body:     JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  return JSON.parse(text);
}

// ──────────────────────────────────────────────────
//  Timer
// ──────────────────────────────────────────────────
function startTimer() {
  stopTimer();
  state.startTime = Date.now();
  updateTimerBar();
  state.timerInt = setInterval(() => {
    state.timeLeft--;
    updateTimerBar();
    updateTimerDisplay();
    if (state.timeLeft <= 0) { stopTimer(); doSubmit(true); }
  }, 1000);
}

function stopTimer() {
  if (state.timerInt) clearInterval(state.timerInt);
  state.timerInt = null;
}

function updateTimerBar() {
  const fill = document.getElementById("timerFill");
  if (!fill) return;
  const pct = (state.timeLeft / TOTAL_TIME) * 100;
  fill.style.width = pct + "%";
  fill.className = "timer-fill" + (pct < 20 ? " danger" : pct < 40 ? " warning" : "");
}

function updateTimerDisplay() {
  const el = document.getElementById("timerDisplay");
  if (!el) return;
  const pct = state.timeLeft / TOTAL_TIME;
  el.textContent = "⏱ " + fmt(state.timeLeft);
  el.className = "timer-display" + (pct < 0.2 ? " danger" : pct < 0.4 ? " warning" : "");
}

function fmt(s) {
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}

function timeUsed() {
  return TOTAL_TIME - state.timeLeft;
}

// ──────────────────────────────────────────────────
//  Flow
// ──────────────────────────────────────────────────
async function startExam() {
  const nameEl  = document.getElementById("inputName");
  const emailEl = document.getElementById("inputEmail");
  const name    = nameEl ? nameEl.value.trim() : "";
  const email   = emailEl ? emailEl.value.trim() : "";

  if (!name) {
    const err = document.getElementById("errName");
    if (err) { err.style.display = "block"; err.textContent = "Vui lòng nhập họ tên."; }
    return;
  }

  state.userName  = name;
  state.userEmail = email;

  state.screen = "loading";
  render();

  try {
    const questions = await fetchQuestions();
    state.questions = questions;
    state.answers   = {};
    state.current   = 0;
    state.timeLeft  = TOTAL_TIME;
    state.result    = null;
    state.screen    = "exam";
    render();
    startTimer();
  } catch (e) {
    state.screen   = "error";
    state.errorMsg = e.message;
    render();
  }
}

async function doSubmit(auto = false) {
  if (!auto) {
    const unanswered = state.questions.length - Object.keys(state.answers).length;
    if (unanswered > 0) {
      if (!confirm(`Còn ${unanswered} câu chưa trả lời. Bạn có chắc muốn nộp bài?`)) return;
    }
  }
  stopTimer();

  const answers = state.questions.map((q, i) => ({
    id:     q.id,
    chosen: state.answers[i] || null
  }));

  state.screen = "submitting";
  render();

  try {
    const result = await submitToAPI({
      action:   "submit",
      name:     state.userName,
      email:    state.userEmail,
      answers,
      timeUsed: timeUsed()
    });
    state.result = result;
    state.screen = "result";
    render();
  } catch (e) {
    state.screen = "result";
    state.result = { _offline: true, error: e.message };
    render();
  }
}

function retry() {
  stopTimer();
  state.screen = "welcome";
  render();
}

// ──────────────────────────────────────────────────
//  Render
// ──────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if      (state.screen === "welcome")    app.innerHTML = renderWelcome();
  else if (state.screen === "loading")    app.innerHTML = renderLoading();
  else if (state.screen === "exam")       app.innerHTML = renderExam();
  else if (state.screen === "submitting") app.innerHTML = renderSubmitting();
  else if (state.screen === "result")     app.innerHTML = renderResult();
  else if (state.screen === "error")      app.innerHTML = renderError();
}

function renderWelcome() {
  return `
  <div class="welcome">
    <div class="welcome-badge">Kỳ Sát Hạch Chính Thức</div>
    <h1>Thiết Kế Quy Hoạch<br>Xây Dựng Hạng III</h1>
    <p class="welcome-desc">Bộ câu hỏi sát hạch kiến thức pháp luật và chuyên môn nghề nghiệp</p>
    <div class="info-grid">
      <div class="info-card"><div class="info-card-label">Thời gian</div><div class="info-card-value">30</div><div class="info-card-sub">Phút</div></div>
      <div class="info-card"><div class="info-card-label">Số câu</div><div class="info-card-value">30</div><div class="info-card-sub">Câu ngẫu nhiên</div></div>
      <div class="info-card"><div class="info-card-label">Pháp luật</div><div class="info-card-value">10</div><div class="info-card-sub">Điểm tối đa</div></div>
      <div class="info-card"><div class="info-card-label">Chuyên môn</div><div class="info-card-value">20</div><div class="info-card-sub">Điểm tối đa</div></div>
    </div>
    <div class="pass-box"><strong>Điều kiện đạt:</strong> Pháp luật <strong>≥ 7/10</strong> &nbsp;và&nbsp; Tổng <strong>≥ 21/30</strong></div>
    <div class="form-section">
      <h3>Thông tin thí sinh</h3>
      <div class="form-row">
        <label>Họ và tên *</label>
        <input id="inputName" type="text" placeholder="Nguyễn Văn A" autocomplete="name">
        <div class="error-msg" id="errName"></div>
      </div>
      <div class="form-row">
        <label>Email / Mã nhân viên</label>
        <input id="inputEmail" type="text" placeholder="example@company.com (không bắt buộc)">
      </div>
    </div>
    <button class="btn-start" onclick="startExam()">Bắt Đầu Sát Hạch →</button>
  </div>`;
}

function renderLoading() {
  return `<div class="loading"><div class="spinner"></div><p>Đang tải đề thi từ ngân hàng câu hỏi...</p></div>`;
}

function renderSubmitting() {
  return `<div class="submitting"><div class="spinner"></div><p>Đang chấm điểm và ghi kết quả...</p></div>`;
}

function renderExam() {
  const q      = state.questions[state.current];
  const chosen = state.answers[state.current];
  const total  = state.questions.length;
  const done   = Object.keys(state.answers).length;
  const pct    = ((state.current + 1) / total * 100).toFixed(1);

  const plDone = state.questions.filter((qq,i) => state.answers[i] !== undefined && qq.section === "phap_luat").length;
  const cmDone = state.questions.filter((qq,i) => state.answers[i] !== undefined && qq.section !== "phap_luat").length;

  const dots = state.questions.map((qq, i) => {
    let cls = "dot" + (i === state.current ? " current" : state.answers[i] !== undefined ? " answered" : "");
    return `<div class="${cls}" onclick="go(${i})">${i+1}</div>`;
  }).join("");

  const opts = ["a","b","c","d"].filter(k => q.opts[k]).map(k => {
    const sel = chosen === k ? " selected" : "";
    return `<button class="opt-btn${sel}" onclick="pick('${k}')" ${chosen ? "disabled" : ""}>
      <span class="opt-key">${k.toUpperCase()}</span>
      <span class="opt-text">${q.opts[k]}</span>
    </button>`;
  }).join("");

  const isPhapLuat = q.section === "phap_luat";
  const tag = isPhapLuat
    ? `<span class="section-tag pl">Pháp luật</span>`
    : `<span class="section-tag cm">Chuyên môn</span>`;

  const isLast = state.current === total - 1;

  return `
  <div class="exam-topbar">
    <div class="progress-text">Câu <span>${state.current+1}</span>/<span>${total}</span> &nbsp;·&nbsp; Đã làm: <span>${done}</span></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="score-chip pl">PL <span>${plDone}/${MAX_PL}</span></div>
      <div class="score-chip cm">CM <span>${cmDone}/${MAX_CM}</span></div>
      <div class="timer-display" id="timerDisplay">⏱ ${fmt(state.timeLeft)}</div>
    </div>
  </div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
  <div class="q-card">
    ${tag}
    <div class="q-number">CÂU ${state.current+1}</div>
    <div class="q-text">${q.question}</div>
    <div class="options">${opts}</div>
    ${chosen ? `<div style="font-size:12px;color:var(--text-muted);margin-top:12px">✓ Đã chọn đáp án ${chosen.toUpperCase()}</div>` : ""}
  </div>
  <div class="nav-area">
    <button class="btn-nav" onclick="go(${state.current-1})" ${state.current===0?"disabled":""}>← Trước</button>
    <button class="btn-nav" onclick="jumpNext()">Câu chưa làm ↓</button>
    ${isLast
      ? `<button class="btn-nav primary" onclick="doSubmit()">Nộp bài →</button>`
      : `<button class="btn-nav primary" onclick="go(${state.current+1})">Tiếp →</button>`}
  </div>
  <div class="dot-nav">${dots}</div>`;
}

function renderResult() {
  const r = state.result;
  if (!r || r._offline) {
    return `<div class="result">
      <div class="result-badge fail">⚠️</div>
      <h2 class="fail">Lỗi kết nối</h2>
      <p class="result-verdict">Không thể ghi kết quả lên server. Vui lòng kiểm tra lại API URL.</p>
      ${r ? `<p style="font-size:12px;color:var(--text-muted)">${r.error}</p>` : ""}
      <br><button class="btn-retry" onclick="retry()">Thử lại</button>
    </div>`;
  }

  const {plScore, cmScore, total, passed, passConditions} = r;

  return `
  <div class="result">
    <div class="result-badge ${passed?"pass":"fail"}">${passed?"🎉":"📋"}</div>
    <h2 class="${passed?"pass":"fail"}">${passed?"ĐẠT YÊU CẦU":"CHƯA ĐẠT"}</h2>
    <p class="result-verdict">Xin chào <strong>${state.userName}</strong> · Thời gian làm bài: ${fmt(timeUsed())}</p>
    <div class="score-breakdown">
      <div class="sc-box total"><div class="sc-val">${total}/30</div><div class="sc-label">Tổng điểm</div></div>
      <div class="sc-box pl"><div class="sc-val">${plScore}/10</div><div class="sc-label">Pháp luật</div></div>
      <div class="sc-box cm"><div class="sc-val">${cmScore}/20</div><div class="sc-label">Chuyên môn</div></div>
    </div>
    <div class="conditions">
      <div class="cond-row">
        <span class="cond-icon">${passConditions.pl.passed?"✅":"❌"}</span>
        <span class="cond-text">Điểm pháp luật <strong>${plScore}/10</strong> (yêu cầu ≥ 7)</span>
        <span class="cond-result ${passConditions.pl.passed?"ok":"fail"}">${passConditions.pl.passed?"ĐẠT":"CHƯA ĐẠT"}</span>
      </div>
      <div class="cond-row">
        <span class="cond-icon">${passConditions.total.passed?"✅":"❌"}</span>
        <span class="cond-text">Tổng điểm <strong>${total}/30</strong> (yêu cầu ≥ 21)</span>
        <span class="cond-result ${passConditions.total.passed?"ok":"fail"}">${passConditions.total.passed?"ĐẠT":"CHƯA ĐẠT"}</span>
      </div>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:20px">✅ Kết quả đã được ghi vào hệ thống</p>
    <button class="btn-retry" onclick="retry()">Làm lại</button>
  </div>`;
}

function renderError() {
  return `
  <div class="error-screen">
    <div class="err-icon">🔌</div>
    <h3>Không thể kết nối API</h3>
    <p>Vui lòng kiểm tra Apps Script đã được deploy với quyền <strong>"Anyone"</strong></p>
    <div class="config-box">
      Trong Apps Script:<br><br>
      <code>Deploy → Manage deployments → Edit</code><br><br>
      Đặt <code>Who has access</code> thành <code>Anyone</code>
    </div>
    <p style="font-size:12px;color:var(--text-muted)">${state.errorMsg || ""}</p>
    <button class="btn-retry" onclick="retry()">← Quay lại</button>
  </div>`;
}

// ──────────────────────────────────────────────────
//  Actions
// ──────────────────────────────────────────────────
function pick(key) {
  if (state.answers[state.current] !== undefined) return;
  state.answers[state.current] = key;
  render();
}

function go(i) {
  if (i < 0 || i >= state.questions.length) return;
  state.current = i;
  render();
}

function jumpNext() {
  for (let i = state.current + 1; i < state.questions.length; i++) {
    if (state.answers[i] === undefined) { go(i); return; }
  }
  for (let i = 0; i < state.current; i++) {
    if (state.answers[i] === undefined) { go(i); return; }
  }
  alert("Đã trả lời tất cả câu hỏi!");
}

render();
</script>
</body>
</html>
